  h += '<p class="small" style="margin-top:10px">※ 로컬 시제품 — 작성 내용은 이 기기 안에만 저장됩니다.' + (readonly ? ' PDF는 인쇄 대화상자에서 "PDF로 저장"을 고르세요.' : ' 제출하면 교수 확인 화면에 기록됩니다.') + '</p>';

  sc.innerHTML = h;

  function collect(){
    if(readonly) return data;
    var d = R.data;
    if(!d.meta) d.meta = {};
    if($("rfDate")) d.meta.date = ($("rfDate").value || "").trim();
    if($("rfTeam")) d.meta.team = ($("rfTeam").value || "").trim();
    if(!d.sections) d.sections = {};
    sc.querySelectorAll("[data-sec]").forEach(function(t){ d.sections[t.getAttribute("data-sec")] = t.value; });
    if(!d.tables) d.tables = {};
    sc.querySelectorAll("[data-tbl]").forEach(function(inp){
      var k = inp.getAttribute("data-tbl"), r = parseInt(inp.getAttribute("data-r"),10), c = parseInt(inp.getAttribute("data-c"),10);
      if(!d.tables[k]) d.tables[k] = [];
      if(!d.tables[k][r]) d.tables[k][r] = [];
      d.tables[k][r][c] = inp.value;
    });
    return d;
  }
  function persist(silent){
    var d = collect();
    d.savedAt = today();
    var ok = saveReport(R.sid, d);
    if(!silent) toast(ok ? "임시 저장했습니다." : "저장이 막혀 있습니다(브라우저 설정).");
    return d;
  }
  if($("rpBack")) $("rpBack").onclick = function(){ if(!readonly) persist(true); go(state.role==="prof"?"profdash":"lobby"); };
  if($("rfSave")) $("rfSave").onclick = function(){ persist(false); };
  if($("rfPreview")) $("rfPreview").onclick = function(){ R.data = readonly ? data : persist(true); R.view = "preview"; RENDER.report(); };
  if($("rfWord")) $("rfWord").onclick = function(){ var d = readonly ? data : persist(true); downloadReportWord(R.sid, R.name, d); };
  if($("rfPdf")) $("rfPdf").onclick = function(){ var d = readonly ? data : persist(true); printReportPDF(R.sid, R.name, d); };
  if($("rfSubmit")) $("rfSubmit").onclick = function(){
    var d = collect(); d.submitted = true; d.submittedAt = today(); d.savedAt = today();
    saveReport(R.sid, d); R.data = d;
    toast("보고서를 제출했습니다. (교수 확인 화면에 기록됩니다)");
    if(!reduced) showReward({ face:"celebrate", kicker:"결과보고서 제출", title:"제출 완료", sub:curLab().weekLabel + " " + curLab().title + " 결과보고서", hold:2600 });
    RENDER.report();
  };
  /* 편집 중 자동 저장(입력 멈춤 시) */
  if(!readonly){
    var saveTimer = null;
    sc.querySelectorAll("textarea,[data-tbl],#rfDate,#rfTeam").forEach(function(el){
      el.oninput = function(){ if(saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(function(){ persist(true); }, 700); };
    });
    /* 이미지 업로드 슬롯 바인딩 */
    sc.querySelectorAll("[data-imgpick]").forEach(function(b){
      b.onclick = function(){ var f = document.getElementById(b.getAttribute("data-imgpick")); if(f) f.click(); };
    });
    sc.querySelectorAll("[data-imgfile]").forEach(function(inp){
      inp.onchange = function(){
        var file = inp.files && inp.files[0];
        if(!file) return;
        var key = inp.getAttribute("data-imgfile"), idx = parseInt(inp.getAttribute("data-idx"), 10);
        toast("사진 처리 중…");
        resizeImageFile(file, 1000, function(durl, err){
          if(err || !durl){ toast(err || "사진을 불러오지 못했습니다."); return; }
          collect();                               /* 고찰 등 현재 입력 보존 */
          var d = R.data;
          if(!d.images) d.images = {};
          if(!Array.isArray(d.images[key])) d.images[key] = [];
          var prev = d.images[key][idx] || "";
          d.images[key][idx] = durl;
          d.savedAt = today();
          var ok = saveReport(R.sid, d);
          if(!ok){
            d.images[key][idx] = prev;              /* 롤백 */
            toast("사진이 너무 커 저장하지 못했습니다. 더 작은 사진(또는 더 적은 장수)으로 올려 주세요.");
            return;
          }
          toast("사진을 올렸습니다.");
          RENDER.report();                          /* 미리보기 갱신 */
        });
      };
    });
    sc.querySelectorAll("[data-imgdel]").forEach(function(b){
      b.onclick = function(){
        var key = b.getAttribute("data-imgdel"), idx = parseInt(b.getAttribute("data-idx"), 10);

 *   실제 저장키(progKeyFor·reportKey·TEAMS_KEY·EARLY_KEY)에 그대로 주입하므로
 *   교수 대시보드가 실제 학생 활동과 똑같이 표·집계를 그린다. 덮어쓰기 전 원래
 *   값을 스냅샷(DEMO_SNAPSHOT_KEY)에 담아 두어, [지우기]로 정확히 원상복구한다.
 * ========================================================================*/
var DEMO_SNAPSHOT_KEY = "dmu_gene_lab_demo_snapshot";

/* 배양 접시 예시 이미지 — canvas 로 즉석 생성(외부 통신 없음). colonies = 콜로니 점 개수 */
function demoPlate(seed, colonies, label){
  try{
    var cv = document.createElement("canvas"); cv.width = 220; cv.height = 160;
    var g = cv.getContext("2d");
    g.fillStyle = "#f6f1e6"; g.fillRect(0, 0, 220, 160);
    g.beginPath(); g.arc(110, 78, 66, 0, Math.PI * 2); g.fillStyle = "#ece0c2"; g.fill();
    g.lineWidth = 5; g.strokeStyle = "#c3aa72"; g.stroke();
    var r = ((seed * 9301 + 49297) % 233280 + 233280) % 233280;
    function rnd(){ r = (r * 9301 + 49297) % 233280; return r / 233280; }
    for(var i = 0; i < colonies; i++){
      var a = rnd() * Math.PI * 2, rad = rnd() * 54;
      var x = 110 + Math.cos(a) * rad, y = 78 + Math.sin(a) * rad;
      g.beginPath(); g.arc(x, y, 1.5 + rnd() * 2.4, 0, Math.PI * 2);
      g.fillStyle = "#cdbb7d"; g.fill();
    }
    g.fillStyle = "#5a4a1e"; g.font = "11px sans-serif";
    g.fillText(String(label || ""), 8, 152);
    return cv.toDataURL("image/jpeg", 0.7);
  }catch(e){ return ""; }
}

function clearDemo(){
  var snap = null;
  try{ snap = JSON.parse(localStorage.getItem(DEMO_SNAPSHOT_KEY) || "null"); }catch(e){ snap = null; }
  if(snap && typeof snap === "object"){
    for(var k in snap){ if(snap.hasOwnProperty(k)){
      try{
        if(snap[k] === null || snap[k] === undefined) localStorage.removeItem(k);
        else localStorage.setItem(k, snap[k]);
      }catch(e){}
    } }
  }
  try{ localStorage.removeItem(DEMO_SNAPSHOT_KEY); }catch(e){}
  return true;
}

/* ==========================================================================
 * 출석부 관리 — 교수가 명단을 등록·수정·삭제·백업한다(교수 전용).
 *   🔒 명단(학번·이름)은 소스코드가 아니라 이 기기 localStorage(ROSTER_KEY)에만 저장된다.
 *   기능: ① 일괄 등록(붙여넣기)  ② 개별 추가/수정  ③ 삭제  ④ 목록·인원수  ⑤ 백업/복원
 * ========================================================================*/
/* "학번 이름" / "학번,이름" / "학번\t이름" 여러 줄, 또는 JSON 배열을 [{sid,name}] 로 파싱.
   반환 { list:[{sid,name}], bad:[원문줄...] } — bad 는 형식이 안 맞아 건너뛴 줄. */
function parseRosterText(text){
  var out = [], bad = [];
  var t = String(text || "").trim();
  if(!t) return { list: out, bad: bad };
  /* JSON(배열/객체) 형태면 JSON 으로 먼저 시도 */
  if(t.charAt(0) === "[" || t.charAt(0) === "{"){
    try{
      var j = JSON.parse(t);
      var arr = Array.isArray(j) ? j : (j && Array.isArray(j.roster) ? j.roster : null);
      if(arr){
        arr.forEach(function(r){
          var sid = r && (r.sid != null ? String(r.sid) : "");
          var name = r && (r.name != null ? String(r.name) : "");
          sid = sid.replace(/\s/g, ""); name = name.trim();
          if(/^\d{8}$/.test(sid) && name) out.push({ sid: sid, name: name });
          else bad.push(JSON.stringify(r));
        });
        return { list: out, bad: bad };
      }
    }catch(e){ /* JSON 아니면 아래 줄 단위 파싱으로 */ }
  }
  /* 줄 단위: 첫 8자리 숫자를 학번으로, 나머지를 이름으로 */
  t.split(/\r?\n/).forEach(function(line){
    var s = line.trim();
    if(!s) return;
    /* 구분자(쉼표·탭·공백)로 나눠 8자리 숫자 토큰을 학번으로 잡는다 */
    var parts = s.split(/[,\t]+/).length > 1 ? s.split(/[,\t]+/) : s.split(/\s+/);
    var sid = "", name = "";
    for(var i = 0; i < parts.length; i++){
      var p = parts[i].trim();
      if(!sid && /^\d{8}$/.test(p)){ sid = p; }
      else if(p){ name += (name ? " " : "") + p; }
    }
    if(/^\d{8}$/.test(sid) && name) out.push({ sid: sid, name: name });
    else bad.push(s);
  });
  return { list: out, bad: bad };
}
/* 명단을 "학번 이름" 여러 줄 텍스트로 */
function rosterToText(list){
  return (list || []).map(function(r){ return r.sid + " " + r.name; }).join("\n");
}
/* 텍스트를 클립보드로 복사(실패 시 textarea 선택으로 폴백) */
function copyText(text, okMsg){
  var done = function(ok){ toast(ok ? (okMsg || "복사했습니다.") : "복사가 막혔습니다. 아래 상자에서 직접 선택해 복사하세요."); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
      return;
    }
  }catch(e){}
  fallback();
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(!!ok);
    }catch(e2){ done(false); }
  }
}

var timerRAF = null, tStart = 0, tLimit = 0, tOnEnd = null;
function startTimer(sec, onEnd, sel){
  stopTimer();
  tStart = Date.now(); tLimit = sec * 1000; tOnEnd = onEnd;
  var bar = document.querySelector(sel || "#sc-lquiz .tbar");
  var fill = bar ? bar.querySelector("i") : null;
  function stepf(){
    var left = tLimit - (Date.now() - tStart);
    var r = Math.max(0, left / tLimit);
    if(fill) fill.style.width = (r * 100) + "%";
    if(bar){ bar.classList.toggle("warn", r <= 0.5 && r > 0.2); bar.classList.toggle("crit", r <= 0.2); }
    if(left <= 0){ timerRAF = null; if(tOnEnd){ var f = tOnEnd; tOnEnd = null; f(); } return; }
    timerRAF = requestAnimationFrame(stepf);
  }
  timerRAF = requestAnimationFrame(stepf);
}
function stopTimer(){ if(timerRAF){ cancelAnimationFrame(timerRAF); timerRAF = null; } tOnEnd = null; }
function elapsedSec(){ return (Date.now() - tStart) / 1000; }

/* ==========================================================================
 * 공용 — 문항 판정 & 답 위젯 (mc·ox·num·order)
 * ========================================================================*/
function judge(q, pick){
  if(q.type === "mc") return pick === q.answer;
  if(q.type === "ox") return pick === q.answer;
  if(q.type === "num"){
    var tol = typeof q.tolerance === "number" ? q.tolerance : 0;
    return isFinite(pick) && Math.abs(pick - q.answer) <= tol;
  }
  if(q.type === "order"){
    if(!Array.isArray(pick) || pick.length !== q.answer.length) return false;
    for(var i = 0; i < q.answer.length; i++){ if(pick[i] !== q.answer[i]) return false; }
    return true;
  }
  return false;
}
/* 답 위젯 HTML. os = order 진행상태 {placed, pool}. locked 시 정오 표시. */

  if(!pool.length){ pool = POOL_TIMED.slice(); state.lquiz.served = []; served = []; }

    var f = pool.filter(function(q){ return q.qid !== ctx.lquiz.lastQid; });

function answerLQ(pick, timedOut){
  var S = ctx.lquiz;
  if(S.phase !== "ask") return;
  stopTimer();
  var q = S.q;
  var rec = state.lquiz.byQid[q.qid] || { answers: 0, corrects: 0, wrongs: 0, firstTry: false };
  var kind;

  if(timedOut){
    kind = "timeout";
    noteWrong(q.qid);
  }else{
    var correct = judge(q, pick);
    var firstResponse = (rec.answers || 0) === 0;
    rec.answers = (rec.answers || 0) + 1;
    state.stats.answered++;
    if(correct){
      rec.corrects = (rec.corrects || 0) + 1;
      state.stats.correct++;
      if(firstResponse) rec.firstTry = true;
      kind = "ok";
      noteRight(q.qid);
    }else{
      rec.wrongs = (rec.wrongs || 0) + 1;
      kind = "no";
      noteWrong(q.qid);
    }
  }
  rec.lastAt = today();
  state.lquiz.byQid[q.qid] = rec;
  /* 진행 카운트 — 한 문항 완료마다 1 (해금 전까지 의미) */
  var wasUnlocked = missionUnlocked();
  state.lquiz.progress = (state.lquiz.progress || 0) + 1;
  if(!state.lquiz.served) state.lquiz.served = [];
  if(state.lquiz.served.indexOf(q.qid) < 0) state.lquiz.served.push(q.qid);
  S.lastQid = q.qid;
  S.phase = "done";
  S.pick = timedOut ? null : pick;
  S.last = { kind: kind };
  saveState();
  if(!wasUnlocked && missionUnlocked()){
    S.announcedUnlock = false;   /* 이번 화면에서 해금 안내를 보여준다 */
    paintTop();
    if(!reduced) showReward({ face:"celebrate", kicker:"미션이 열렸어요", title:"미션 열림", sub:"학습·복습 " + UNLOCK_N() + "문 완료 · 이제 평가에 도전할 수 있어요", hold:3200 });
  }else{
    paintTop();
  }
  if(missionUnlocked()) S.announcedUnlock = false; else S.announcedUnlock = true;
  paintLQ();
  /* 해금 안내를 한 번 보여준 뒤 다음 문항부터는 숨긴다 */
  if(missionUnlocked()) S.announcedUnlock = true;
}

/* ==========================================================================
 * 미션 (평가) — 시간제한 8 + 추리 2 = 10문 · 배점 합 100 · 70점 합격
 * ========================================================================*/
function buildMission(){
  var prevT = state.mission.lastTimed || [], prevR = state.mission.lastReason || [];
  var nT = MISSION_TIMED(), nR = MISSION_REASON();

  var timedPool = POOL_TIMED.filter(function(q){ return prevT.indexOf(q.qid) < 0; });
  if(timedPool.length < nT) timedPool = POOL_TIMED.slice();            /* 풀 소진 시 순환 */
  var timed = shuffle(timedPool).slice(0, nT);

  var reasonPool = POOL_REASON.filter(function(c){ return prevR.indexOf(c.caseId) < 0; });
  if(reasonPool.length < nR) reasonPool = POOL_REASON.slice();
  var reason = shuffle(reasonPool).slice(0, nR);

  var items = timed.map(function(q){ return { kind: "timed", q: q, raw: q.points }; })
    .concat(reason.map(function(c){ return { kind: "reason", cs: c, raw: c.points }; }));

  /* 배점 정규화 — raw 합을 100 으로 스케일, 정수 반올림하며 합 100 유지 */
  var totalRaw = items.reduce(function(s, it){ return s + it.raw; }, 0);
  var scaled = items.map(function(it){ return it.raw * 100 / totalRaw; });
  var pts = roundToSum(scaled, 100);
  items.forEach(function(it, i){ it.points = pts[i]; });

  /* 다음 재도전에서 제외할 직전 문항 기록 */
  state.mission.lastTimed = timed.map(function(q){ return q.qid; });
  state.mission.lastReason = reason.map(function(c){ return c.caseId; });
  saveState();

  return items;
}

function startMission(){
  var items = buildMission();
  ctx.mission = {
    phase: "run", items: items, i: 0,
    answers: [], order: null,
    subEvidence: [], subSuspect: null
  };
  state.mission.attempts = (state.mission.attempts || 0) + 1;
  saveState();
  initMissionItem();
}
function initMissionItem(){
  var M = ctx.mission, it = M.items[M.i];
  M.order = (it.kind === "timed" && it.q.type === "order") ? { placed: [], pool: it.q.steps.map(function(_, i){ return i; }) } : null;
  /* 문항이 처음 열린 시각을 고정해 둔다 — 순서·숫자 문항이 다시 그려져도 제한시간이 리셋되지 않게 한다. */
  M.itemStart = Date.now();
  if(it.kind === "reason"){
    M.subSuspect = null; M.subEvidence = [];
    /* 단서 열람 제한 제거 — 4개(전체)를 처음부터 모두 보여준다. */
  }
  paintMissionItem();
}
/* 미션 타이머 — 고정 deadline 기준. 재렌더(순서 탭)에도 리셋되지 않는다. */
function startMissionTimer(){
  stopTimer();
  var M = ctx.mission, it = M.items[M.i];
  if(!it || it.kind !== "timed") return;
  var total = it.q.limitSec * 1000;
  var deadline = M.itemStart + total;
  var bar = document.querySelector("#sc-mission .tbar");
  var fill = bar ? bar.querySelector("i") : null;
  function stepf(){
    var left = deadline - Date.now();
    var r = Math.max(0, left / total);
    if(fill) fill.style.width = (r * 100) + "%";
    if(bar){ bar.classList.toggle("warn", r <= 0.5 && r > 0.2); bar.classList.toggle("crit", r <= 0.2); }
    if(left <= 0){ timerRAF = null; submitMissionTimed(null, true); return; }
    timerRAF = requestAnimationFrame(stepf);
  }
  timerRAF = requestAnimationFrame(stepf);
}
function paintMissionItem(){
  var M = ctx.mission, it = M.items[M.i], n = M.items.length;
  var h = "";
  h += '<div class="prog-wrap"><div class="prog-lbl"><span>미션 문항</span><span><b>' + (M.i + 1) + '</b> / ' + n + '</span></div>';
  h += '<div class="prog-bar full"><i style="width:' + ((M.i) / n * 100) + '%"></i></div></div>';

  if(it.kind === "timed"){
    /* 미션은 평가이므로 연습 모드(timerOff)와 무관하게 모든 시간제한 문항에 타이머를 강제한다. */
    var q = it.q;
    h += '<div class="qmeta"><span class="kind">' + kindLabel(q.type) + '</span><span class="p">난이도 Lv' + q.level + '</span>' +
      '<span class="pts">배점 ' + it.points + '점</span>' +
      '<div class="quiz-coli" style="margin-left:auto">' + coli("thinking", "static") + '</div></div>';
    h += '<div class="tbar"><i style="width:100%"></i></div>';
    h += '<p class="small" style="margin:-8px 0 12px">제한 ' + q.limitSec + '초 · 초과 시 0점</p>';
    h += '<div class="qtext">' + esc(q.q) + '</div>';
    h += answerWidget(q, { locked: false, orderState: M.order });
  }else{
    h += paintMissionReason(it);
  }
  h += '<button class="btn ghost center" type="button" id="mQuit">그만두기 (기록 안 됨)</button>';

  var sc = $("sc-mission"); sc.innerHTML = h;
  $("mQuit").onclick = function(){ stopTimer(); ctx.mission = null; go("lobby"); };

  if(it.kind === "timed"){
    var q2 = it.q;
    bindAnswer(sc, q2, M.order, function(pick){ submitMissionTimed(pick, false); }, paintMissionItem);
    startMissionTimer();
  }else{
    bindMissionReason(sc, it);
  }
}
function submitMissionTimed(pick, timedOut){
  var M = ctx.mission, it = M.items[M.i], q = it.q;
  stopTimer();
  var correct = timedOut ? false : judge(q, pick);
  var earned = correct ? it.points : 0;
  M.answers.push({ kind: "timed", q: q, points: it.points, pick: pick, correct: correct, timedOut: !!timedOut, earned: earned });
  advanceMission();
}
/* ---- 미션 추리 문항 ---- */
function paintMissionReason(it){
  var M = ctx.mission, cs = it.cs;

  cs.clues.forEach(function(c){
    var on = M.subEvidence.indexOf(c.id) >= 0;

  return h;

function bindMissionReason(sc, it){
  var M = ctx.mission, cs = it.cs;
  sc.querySelectorAll("[data-rsus]").forEach(function(b){
    b.onclick = function(){ M.subSuspect = b.getAttribute("data-rsus"); paintMissionItem(); };
  });
  sc.querySelectorAll("[data-rev]").forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-rev"); var i = M.subEvidence.indexOf(id);
      if(i >= 0) M.subEvidence.splice(i, 1);
      else{ if(M.subEvidence.length >= 2) M.subEvidence.shift(); M.subEvidence.push(id); }
      paintMissionItem();
    };
  });
  if($("rSubmit")) $("rSubmit").onclick = function(){ submitMissionReason(it); };
}
function submitMissionReason(it){
  var M = ctx.mission, cs = it.cs;
  var right = (M.subSuspect === cs.answer.suspect);
  var evHit = M.subEvidence.filter(function(id){ return cs.answer.evidence.indexOf(id) >= 0; }).length;
  var frac = 0, tier = "wrong";
  if(right){
    if(evHit === 2){ frac = 1; tier = "full"; }
    else if(evHit === 1){ frac = 0.75; tier = "partial1"; }
    else { frac = 0.5; tier = "causeOnly"; }
  }
  var earned = it.points * frac;
  M.answers.push({ kind: "reason", cs: cs, points: it.points, suspect: M.subSuspect, evidence: M.subEvidence.slice(),
    right: right, evHit: evHit, tier: tier, earned: earned });
  advanceMission();
}
function advanceMission(){
  var M = ctx.mission;
  M.i++;
  if(M.i >= M.items.length){ finishMission(); return; }
  initMissionItem();
}
function finishMission(){
  var M = ctx.mission;
  var earned = M.answers.reduce(function(s, a){ return s + (a.earned || 0); }, 0);
  var score = Math.round(earned);
  var pass = score >= MISSION_PASS();
  M.score = score; M.pass = pass; M.phase = "result";

  state.mission.lastScore = score;
  if(score > (state.mission.bestScore || 0)) state.mission.bestScore = score;
  if(pass && !state.mission.passed){
    state.mission.passed = true;
  }
  saveState();
  paintTop();
  if(pass) showReward({ face:"celebrate", kicker:"미션 합격", title:score + "점 · 합격!", sub:curLab().weekLabel + " 보고서 점수를 받았어요", hold:3200 });
  paintMissionResult();
}

 * ========================================================================*/
RENDER.growth = function(){
  var need = UNLOCK_N(), prog = learnProgress();
  var all = state.stats.answered ? (state.stats.correct / state.stats.answered) : 0;
  var passed = state.mission.passed;
  var h = "";
  h += '<h2 class="sc-h">내 기록</h2>';
  h += '<div class="greet">' + coli(passed ? "celebrate" : "idle", passed ? "" : "static") +
    '<div class="speech">' + esc(state.studentName || "학습자님") + ', ' +
    (passed ? "미션에 합격했어요! 잘했어요." : (missionUnlocked() ? "미션이 열렸어요. 준비되면 도전해요!" : "지금까지 " + prog + "문 풀었어요. 미션까지 " + Math.max(0, need - prog) + "문!")) +
    '</div></div>';

  /* 응시자 */
  h += '<div class="card"><h3>🧑‍🔬 ' + esc(state.studentName || "학습자님") + '</h3>';
  h += '<p class="muted">' + (state.studentId ? '학번 ' + esc(state.studentId) : '학번 미입력') + ' · 학습 도우미 동그래와 함께</p></div>';

  /* 진행 요약 */
  h += '<div class="card"><h3>진행</h3><div class="tblwrap"><table>' +
    '<tr><th>예습</th><td>' + (hasLearn() ? (learnRead() ? "읽음" : "미완료") : "없음") + '</td></tr>' +
    '<tr><th>학습·복습</th><td>' + Math.min(prog, need) + '/' + need + '문 (누적 ' + prog + '문 · 정답률 ' + pct(all) + '%)</td></tr>' +
    '<tr><th>미션 열림</th><td>' + (missionUnlocked() ? "✅ 열림" : "잠김") + '</td></tr>' +
    '<tr><th>미션 합격</th><td>' + (passed ? "✅ 합격 (최고 " + (state.mission.bestScore||0) + "점 · " + (state.mission.attempts||0) + "회 응시)" : "미합격 (" + (state.mission.attempts||0) + "회 응시)") + '</td></tr>' +
    '<tr><th>오답노트</th><td>' + noteList().length + '문항</td></tr>' +
    '</table></div>';
  h += '<button class="btn sm center" type="button" data-go="notes" style="margin-top:10px">오답노트 바로가기</button></div>';

  /* 저장/초기화 */
  h += '<div class="card"><h3>저장</h3><p class="small">' + esc(C.meta.storageNote || "") +
    (storageOk ? "" : "<br><span style=\"color:var(--amber)\">현재 이 브라우저에서는 저장이 되지 않습니다.</span>") + '</p>';
  h += '<button class="btn sm danger center" type="button" id="gwReset">진도 초기화</button></div>';
  h += '<button class="btn ghost center" type="button" data-go="lobby">로비로</button>';

  var sc = $("sc-growth"); sc.innerHTML = h; bindGo(sc);
  if($("gwReset")) $("gwReset").onclick = function(){
    var doReset = function(){
      var keepRole = state.role, keepId = state.studentId, keepName = state.studentName;
      try{ localStorage.removeItem(progKey()); }catch(e){}
      state = defaultState();
      state.role = keepRole; state.studentId = keepId; state.studentName = keepName; state.tutorialDone = true;
      saveState();
      ctx = {}; navStack = []; cur = "lobby";
      paintTop(); toast("초기화했습니다."); go("lobby", false);
    };
    askConfirm("진도를 초기화합니다. 학습 진행 · 미션 기록 · 오답노트가 모두 지워집니다.\n되돌릴 수 없습니다. 계속하시겠습니까?", function(){
      askConfirm("정말 초기화할까요? 이 작업은 되돌릴 수 없습니다.", doReset, { yes:"초기화" });
    });
  };
};

/* ==========================================================================
 * 요약 카드 (원본 유지)
 * ========================================================================*/
RENDER.summary = function(){
  var s = (AW && AW.summaryCard) ? AW.summaryCard : (C.summaryCard || {});
  var h = "";
  h += '<h2 class="sc-h">' + esc(s.title || "요약 카드") + '</h2>';
  h += '<p class="sc-p">' + esc(s.pipeline || "") + '</p>';
  if(s.oneLiner){
    h += '<div class="greet">' + coli("explain", "static") + '<div class="speech" style="color:var(--mint)"><b>' + esc(s.oneLiner) + '</b></div></div>';
    h += '<div class="card"><h3 style="color:var(--mint)">' + esc(s.oneLiner) + '</h3><p class="muted">' + esc(s.hook || "") + '</p></div>';
  }
  if(s.concepts){ h += '<div class="card"><h3>개념</h3>'; s.concepts.forEach(function(c){ h += '<div class="fb ok"><div class="h">' + esc(c.h) + '</div><div class="b">' + esc(c.d) + '</div></div>'; }); h += '</div>'; }
  if(s.numbers){ h += '<div class="card"><h3>수치</h3><div class="tblwrap"><table>'; s.numbers.forEach(function(n){ h += '<tr><th style="white-space:nowrap">' + esc(n.step) + '</th><td>' + esc(n.value) + '</td></tr>'; }); h += '</table></div></div>'; }
  if(s.cautions){ h += '<div class="card"><h3>주의사항</h3>'; s.cautions.forEach(function(c){ h += '<div class="fb bad"><div class="b">' + esc(c) + '</div></div>'; }); h += '</div>'; }
  if(s.expected){
    h += '<div class="card"><h3>예상 결과</h3><p class="small" style="margin:0 0 6px">잘 됐을 때</p>';
    (s.expected.good || []).forEach(function(g){ h += '<div class="fb ok"><div class="b">' + esc(g) + '</div></div>'; });
    h += '<p class="small" style="margin:10px 0 6px">이상 신호</p>';
    (s.expected.suspect || []).forEach(function(g){ h += '<div class="fb miss"><div class="b">' + esc(g) + '</div></div>'; });
    h += '</div>';
  }
  if(s.closing) h += '<div class="card"><h3>마무리</h3><p class="muted">' + esc(s.closing) + '</p>' + (s.report ? '<p class="small">' + esc(s.report) + '</p>' : "") + (s.source ? '<div class="src">출처 · ' + esc(s.source) + '</div>' : "") + '</div>';
  h += '<button class="btn ghost center" type="button" data-go="lobby">로비로</button>';
  var sc = $("sc-summary"); sc.innerHTML = h; bindGo(sc);
};

/* ==========================================================================
 * 시작
 * ========================================================================*/
function boot(){
  if(!window.GAME_CONTENT){
    var b = $("checkBanner");
    b.hidden = false;
    b.innerHTML = "<b>⚠ content.js 를 읽지 못했습니다.</b> index.html 과 같은 폴더에 content.js 가 있어야 합니다.";
    return;
  }
  storageOk = probeStorage();
  ACTIVE_WEEK = "w02";
  AW = weekPack(ACTIVE_WEEK);
  buildDerived();
  runCheck();
  buildBgFx();

  $("backBtn").onclick = back;

  /* 저장된 로그인(세션)이 있고 유효하면 자동 재개, 없으면 로그인 화면. */
  var sess = loadSession();
  var ok = false;
  if(sess){
    if(sess.role === "prof" && checkProf(sess.name, C.prof.pid)){
      applyIdentity("prof", "", C.prof.name); ok = true; paintTop(); go("profdash", false);
    }else if(sess.role === "student" && findStudent(sess.name, sess.sid)){
      applyIdentity("student", sess.sid, sess.name); ok = true; paintTop(); go("labs", false);
    }
  }
  if(!ok){
    clearSession();
    state = defaultState();
    roleGateStep.role = null; showLogin(); paintTop();
  }
}
boot();

})();
</script>

</html>
