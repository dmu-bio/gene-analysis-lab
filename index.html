<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유전자분석 · 실습 학습·미션</title>
<style>
/* ==========================================================================
   유전자분석 — 실습 학습·미션 (로컬 전용 · 미배포)
   밝고 깔끔한 일반 학습 앱 톤. 외부 폰트·스크립트·이미지·통신 일절 없음. file:// 로 바로 열립니다.
   마스코트(동그래)는 인라인 SVG 스프라이트 + 절제된 CSS 애니메이션.
   ========================================================================== */
:root{
  --bg:#eef1f6; --bg2:#f6f8fb; --card:#ffffff; --card2:#f7f9fc; --card3:#eef2f7;
  --glass:#ffffff; --glass-line:#e3e8ef;
  --line:#e5e9f0; --line2:#cbd5e1;
  --tx:#1c2733; --tx2:#4c5a6a; --tx3:#8494a5;
  --mint:#2b6cb0; --cyan:#3a7fc4; --magenta:#5a67d8; --violet:#5a67d8;
  --green:#2f855a; --amber:#b7791f; --red:#c53030; --gold:#b7791f;
  --mintdk:#e8f1fb; --amberdk:#fbf1df; --reddk:#fdecec; --greendk:#e7f4ec;
  --glow-mint:0 1px 3px rgba(16,42,72,.08),0 4px 14px rgba(16,42,72,.06);
  --glow-cyan:0 1px 3px rgba(16,42,72,.08);
  --glow-magenta:0 1px 3px rgba(16,42,72,.08);
  --shadow:0 1px 2px rgba(16,42,72,.06),0 2px 8px rgba(16,42,72,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","맑은 고딕",sans-serif;
  font-size:16px; line-height:1.62; word-break:keep-all; overflow-wrap:anywhere;
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- 배경 장식 제거 (게임식 분자·DNA 흐름 삭제) ---------- */
#bgfx{display:none}

/* ---------- 검증 배너 ---------- */
#checkBanner{position:relative;z-index:50;background:var(--reddk);border-bottom:2px solid var(--red);color:#7a2020;padding:12px 14px;font-size:15px;line-height:1.5}
#checkBanner b{color:var(--red)}
#checkBanner ul{margin:8px 0 0 18px;padding:0}

/* ---------- 상단 바 ---------- */
#topbar{position:sticky;top:0;z-index:40;background:#ffffff;border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:center;gap:10px;padding:9px 14px}
.tb-back{flex:0 0 auto;min-width:44px;min-height:44px;border:1px solid var(--line2);background:var(--card2);border-radius:12px;cursor:pointer;font-size:18px;line-height:1;color:var(--tx)}
.tb-back:active{transform:translateY(1px)}
.hud-ava{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--mintdk);border:1.5px solid var(--mint);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.hud-ava .coli-svg{width:38px;transform:translateY(3px)}
.tb-id{flex:1 1 auto;min-width:0}
.tb-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{flex:0 0 auto;text-align:right;min-width:74px}
.tb-bar{height:7px;border-radius:99px;background:var(--card3);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.tb-bar>i{display:block;height:100%;width:0;border-radius:99px;background:var(--mint);transition:width .5s ease}
.tb-barlbl{font-size:10px;color:var(--tx3);margin-top:2px;letter-spacing:.02em}
.notice{background:var(--amberdk);border-top:1px solid #e6d3a8;color:#8a6516;font-size:12.5px;line-height:1.45;padding:7px 14px;text-align:center}
.notice b{color:var(--amber)}

/* ---------- 화면 ---------- */
main{position:relative;z-index:1;padding:16px 0 132px}
.screen{display:none}
.screen.active{display:block;animation:scEnter .3s ease-out}
@keyframes scEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.sc-h{font-size:20px;margin:2px 0 4px}
p.sc-p{color:var(--tx2);font-size:14.5px;margin:0 0 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.tight{padding:12px}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--tx2);font-size:14px}
.small{font-size:13px;color:var(--tx3)}
.src{font-size:12px;color:var(--tx3);margin-top:8px;border-top:1px dashed var(--line2);padding-top:7px}
.pre{white-space:pre-wrap}

/* ---------- 버튼 ---------- */
.btn{display:block;width:100%;min-height:50px;padding:13px 14px;margin:0 0 10px;background:var(--card);color:var(--tx);
  border:1px solid var(--line2);border-radius:12px;cursor:pointer;text-align:left;font-size:16px;line-height:1.45}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--mint);color:#ffffff;border-color:var(--mint);font-weight:800;text-align:center}
.btn.primary:active{background:#255d98}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.center{text-align:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:44px;padding:10px 12px;font-size:14.5px;margin-bottom:8px}
.btn.danger{border-color:var(--red);color:var(--red)}
/* 📅 교수 대시보드 주차 선택 — 가로 스크롤 없이 작은 버튼이 줄바꿈되어 다 보이게 */
.wkpick{display:flex;flex-wrap:wrap;gap:6px}
.wkbtn{flex:0 0 auto;width:auto;min-height:40px;padding:7px 10px;margin:0;border-radius:10px;
  border:1px solid var(--line2);background:#eef1f4;color:var(--tx2);font-size:13.5px;line-height:1.2;
  font-weight:600;cursor:pointer;text-align:center;white-space:nowrap}
.wkbtn:active{transform:scale(.97)}
.wkbtn.on{background:var(--mint);border-color:var(--mint);color:#ffffff;font-weight:800}
.wkbtn .pre{font-size:11px;font-weight:600;opacity:.85;margin-left:2px}
.row{display:flex;gap:8px}
.row>*{flex:1 1 0;min-width:0}

/* ---------- 로비 헤더 ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-top:3px solid var(--mint);
  background:#ffffff;border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .helix-band{display:none}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:12px;letter-spacing:.1em;color:var(--mint);font-weight:800}
.hero h1{font-size:24px;margin:6px 0 4px;line-height:1.3;color:var(--tx)}
.hero .sub{font-size:13.5px;color:var(--tx2)}
.hero .chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--card3);border:1px solid var(--line);color:var(--tx2)}
.chip.mint{background:var(--mintdk);border-color:#c3ddf5;color:var(--mint)}
.chip.amber{background:var(--amberdk);border-color:#e6d3a8;color:var(--amber)}

/* ---------- 마스코트 인사 말풍선 ---------- */
.greet{display:flex;align-items:flex-end;gap:8px;margin:2px 0 12px}
.greet .coli-svg{width:76px;flex:0 0 auto}
.speech{position:relative;flex:1 1 auto;background:var(--card2);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:5px;
  padding:11px 13px;font-size:14px;color:var(--tx);box-shadow:var(--shadow)}
.speech:after{content:"";position:absolute;left:-7px;bottom:12px;width:0;height:0;border:7px solid transparent;border-right-color:var(--card2);border-left:0}

/* ---------- 파이프라인 스텝 목록 (게임 보드 → 일반 목록) ---------- */
.board-wrap{border-radius:12px}
.steplist{margin:0}
.steprow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
.steprow:last-child{border-bottom:0}
.steprow .snum{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--card3);color:var(--tx3);text-align:center;line-height:30px;font-size:13px;font-weight:800}
.steprow .sbd{flex:1 1 auto;min-width:0}
.steprow .swk{font-size:12px;color:var(--tx3)}
.steprow .snm{font-size:15px;font-weight:700;color:var(--tx)}
.steprow .sst{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card3);border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.steprow.cur .snum{background:var(--mintdk);color:var(--mint)}
.steprow.cur .sst{background:var(--mintdk);border-color:#c3ddf5;color:var(--mint)}
.steprow.done .snum{background:var(--greendk);color:var(--green)}
.steprow.done .sst{background:var(--greendk);border-color:#bfe2cd;color:var(--green)}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--tx2)}
.map-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- 모드 버튼 (방어용 · 현재 미사용) ---------- */
.modebtn{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;min-height:64px;padding:12px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;cursor:pointer}
.modebtn:active{transform:scale(.99)}
.modebtn .ic{font-size:22px;line-height:1.15;flex:0 0 auto}
.modebtn .bd{flex:1 1 auto;min-width:0}
.modebtn .h{font-weight:700;font-size:15.5px}
.modebtn .d{font-size:13px;color:var(--tx2);margin-top:2px}
.modebtn .st{font-size:12.5px;margin-top:5px;color:var(--tx3)}
.modebtn.done{border-color:var(--green)}
.modebtn.done .st{color:var(--green)}

/* ---------- 탐색·항목 ---------- */
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:11px 12px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.item .bx{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);margin-top:2px;text-align:center;line-height:19px;font-size:14px}
.item.on{border-color:var(--mint);background:var(--mintdk)}
.item.on .bx{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:900}
.item .nm{font-size:15px}
.item .ds{font-size:12.5px;color:var(--tx3);margin-top:2px}
.fb{border-left:4px solid var(--line2);padding:9px 11px;margin-bottom:8px;background:var(--card2);border-radius:0 10px 10px 0}
.fb.ok{border-left-color:var(--green)}
.fb.miss{border-left-color:var(--amber)}
.fb.bad{border-left-color:var(--red)}
.fb .h{font-weight:700;font-size:14.5px}
.fb .b{font-size:13.5px;color:var(--tx2);margin-top:3px}

/* ---------- 순서 ---------- */
.slot{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;cursor:pointer;min-height:52px}
.slot .no{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--mintdk);color:var(--mint);text-align:center;line-height:26px;font-size:13px;font-weight:800}
.slot.empty{background:transparent;border-style:dashed;color:var(--tx3);cursor:default}
.pool .item{border-style:solid}
.lockmk{color:var(--amber);font-weight:700}

/* ---------- 퀴즈 ---------- */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qhead .p{font-size:13px;color:var(--tx3)}
.qhead .c{margin-left:auto;font-size:13px;font-weight:800;color:var(--mint)}
.quiz-coli{flex:0 0 auto;width:48px;height:54px;margin-left:6px}
.quiz-coli .coli-svg{width:48px}
.tbar{height:10px;border-radius:99px;background:var(--card3);border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
.tbar>i{display:block;height:100%;background:var(--mint);width:100%}
.tbar.warn>i{background:var(--amber)}
.tbar.crit>i{background:var(--red)}
.qtext{font-size:18px;line-height:1.55;font-weight:700;margin:0 0 14px}
.ch{display:flex;gap:10px;width:100%;text-align:left;min-height:54px;padding:13px;margin-bottom:9px;background:var(--card);border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-size:15.5px}
.ch:active{transform:scale(.99)}
.ch .mk{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--card3);text-align:center;line-height:24px;font-size:13px;font-weight:800}
.ch.right{border-color:var(--green);background:var(--greendk)}
.ch.wrong{border-color:var(--red);background:var(--reddk)}
.verdict{position:relative;border-radius:12px;padding:12px 13px;margin-bottom:12px;font-weight:800}
.verdict.ok{background:var(--greendk);border:1px solid var(--green);color:var(--green)}
.verdict.no{background:var(--reddk);border:1px solid var(--red);color:var(--red)}
.verdict.to{background:var(--amberdk);border:1px solid var(--amber);color:var(--amber)}
.play-shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.numin{width:100%;min-height:54px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-size:20px;text-align:center;color:var(--tx)}
.numin:focus{outline:none;border-color:var(--mint)}
.toggle{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;cursor:pointer;min-height:48px}
.toggle .sw{flex:0 0 auto;width:46px;height:26px;border-radius:99px;background:var(--card3);border:1px solid var(--line2);position:relative}
.toggle .sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:99px;background:var(--tx3);transition:left .15s}
.toggle.on .sw{background:var(--mintdk);border-color:var(--mint)}
.toggle.on .sw i{left:22px;background:var(--mint)}
.toggle .lb{flex:1 1 auto;font-size:14.5px}

/* ---------- 추리(사건부) ---------- */
.clue{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:var(--card2)}
.clue.locked{opacity:.85;border-style:dashed}
.clue .lb{font-weight:700;font-size:14.5px}
.clue .bd{font-size:14px;color:var(--tx2);margin-top:6px}
.clue .rh{font-size:13px;color:var(--mint);margin-top:7px;background:var(--mintdk);border-radius:10px;padding:8px 10px}
.pick{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:54px;padding:12px;margin-bottom:9px;background:var(--card);border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-size:15px}
.pick .mk{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--card3);text-align:center;line-height:26px;font-weight:800;font-size:13px}
.pick.on{border-color:var(--mint);background:var(--mintdk)}
.pick.on .mk{background:var(--mint);color:#fff}

/* ---------- 배지·레벨 (방어용 · 현재 미사용) ---------- */
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 7px;text-align:center;background:var(--card)}
.badge.got{border-color:var(--gold);background:var(--amberdk)}
.badge .i{font-size:24px;line-height:1.2}
.badge .n{font-size:11.5px;margin-top:3px;font-weight:700}
.badge.locked{opacity:.5}
.badge .c{font-size:10.5px;color:var(--tx3);margin-top:3px;line-height:1.35}
.lvrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lvrow:last-child{border-bottom:0}
.lvrow .lv{flex:0 0 auto;width:34px;font-weight:800;color:var(--tx3);font-size:13px}
.lvrow .nm{font-weight:700;font-size:14.5px}
.lvrow .cd{font-size:12.5px;color:var(--tx3)}
.lvrow.cur .nm{color:var(--mint)}
.lvrow.locked{opacity:.55}

/* ---------- 표 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--tx3);font-weight:600;font-size:12.5px}
th.nw{white-space:nowrap}
.tblwrap{overflow-x:auto}

/* ---------- 마스코트 동그래 — 절제된 애니메이션 ---------- */
.coli-svg{display:inline-block}
.dgl{position:relative;display:inline-block;line-height:0;vertical-align:bottom}
.dgl .dgl-body{width:100%;height:auto;display:block;position:relative;z-index:1;
  transform-origin:50% 92%;animation:dglIdle 5s ease-in-out infinite;will-change:transform}
.dgl .dgl-shadow{position:absolute;left:50%;bottom:-2%;width:50%;height:5%;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(ellipse at center,rgba(28,39,51,.16),rgba(28,39,51,0) 72%);z-index:0}
.dgl .dgl-fx{position:absolute;inset:0;z-index:2;pointer-events:none}
.dgl .dgl-fx span{position:absolute;opacity:0}
.dgl .spk{width:10%;height:10%;background:radial-gradient(circle,#fff 8%,var(--gold) 34%,transparent 64%);border-radius:50%}
.dgl .spk1{top:6%;left:8%}.dgl .spk2{top:14%;right:6%}.dgl .spk3{top:38%;left:2%}
.dgl .swt{top:16%;right:12%;width:8%;height:11%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:linear-gradient(160deg,#8fd8ff,#3aa0e6)}

/* 아주 은은한 idle 만 — 통통 튐·기울임·스쿼시 제거 */
@keyframes dglIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6%)}}
/* 정답: 짧고 작은 반짝임 (1회) */
.dgl[data-mood="success"] .spk{animation:dglSpk 1.4s ease-in-out 1}
.dgl[data-mood="success"] .spk2{animation-delay:.2s}
.dgl[data-mood="success"] .spk3{animation-delay:.4s}
@keyframes dglSpk{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:.9;transform:scale(1)}}
/* 오답: 작은 땀방울 (1회) */
.dgl[data-mood="fail"] .swt{animation:dglSwt 1.5s ease-in 1}
@keyframes dglSwt{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.9;transform:translateY(0) scale(1)}75%{opacity:.9;transform:translateY(240%) scale(1)}100%{opacity:0;transform:translateY(280%) scale(.8)}}

/* HUD 원형 아바타 */
.hud-ava .dgl{width:100%!important;height:100%!important;transform:none!important}
.hud-ava .dgl .dgl-body{width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.hud-ava .dgl .dgl-shadow,.hud-ava .dgl .dgl-fx{display:none}

/* ---------- 축하 카드 (정적 · 화려한 연출 제거) ---------- */
#rewardOv{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(28,39,51,.45);padding:20px}
#rewardOv.on{display:flex}
.reward-card{position:relative;max-width:340px;width:100%;text-align:center;padding:22px 18px 20px;border-radius:18px;
  background:#ffffff;border:1px solid var(--line);border-top:4px solid var(--green);box-shadow:0 12px 40px rgba(16,42,72,.22);overflow:hidden}
.reward-card>*{position:relative;z-index:1}
.reward-coli .coli-svg{width:104px;margin:0 auto}
.reward-kicker{font-size:12px;letter-spacing:.06em;color:var(--green);font-weight:800;margin-top:4px}
.reward-title{font-size:21px;font-weight:900;margin-top:4px;color:var(--tx)}
.reward-sub{font-size:14px;color:var(--tx2);margin-top:6px}
.reward-tap{font-size:12px;color:var(--tx3);margin-top:16px}

/* ---------- 튜토리얼 ---------- */
#tutorial{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:none}
#tutorial.on{display:block}
#tutorial .wrap{padding-bottom:40px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:var(--card);box-shadow:var(--shadow)}
.tcard .i{font-size:20px}
.tcard .h{font-weight:800;font-size:15px;margin-top:3px}
.tcard .d{font-size:13.5px;color:var(--tx2);margin-top:3px}
.tut-coli{display:flex;justify-content:center;margin:4px 0 2px}
.tut-coli .coli-svg{width:104px}
.err{color:var(--red);font-size:13.5px;margin:6px 0 0;min-height:20px}

/* ---------- 토스트 ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:80;max-width:460px;width:calc(100% - 28px);
  background:#1c2733;color:#fff;border:1px solid #1c2733;border-radius:12px;padding:11px 13px;font-size:14px;display:none;box-shadow:0 6px 20px rgba(16,42,72,.28)}
#toast.on{display:block}

/* ---------- 인앱 확인 모달 (샌드박스에서도 동작) ---------- */
#confirmOv{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(16,42,72,.42)}
#confirmOv.on{display:flex}
#confirmOv .cf-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(16,42,72,.3)}
#confirmOv .cf-msg{color:var(--tx);font-size:15px;line-height:1.6;margin:0 0 16px}
#confirmOv .cf-btns{display:flex;gap:10px}
#confirmOv .cf-btns .btn{margin:0;flex:1}

/* ---------- 로비 카드 ---------- */
.lobbycard{border:1px solid var(--line)}
.lc2-row{display:flex;gap:11px;align-items:flex-start}
.lc2-ic{font-size:26px;line-height:1.1;flex:0 0 auto}
.lc2-bd{flex:1 1 auto;min-width:0}
.lc2-t{font-size:16.5px;font-weight:800}
.lc2-d{font-size:13px;color:var(--tx2);margin-top:2px}
.lc2-prog{margin:11px 0 12px}
.lobbycard .btn{margin-bottom:0}

/* ---------- 7개 실습 목록 카드 ---------- */
.lab-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:70px;padding:13px 12px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--line2);border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
.lab-card:active{transform:scale(.99)}
.lab-card.open{border-color:var(--mint)}
.lab-card .lab-no{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--card3);color:var(--tx3);
  text-align:center;line-height:38px;font-size:20px;font-weight:800}
.lab-card.open .lab-no{background:var(--mintdk);color:var(--mint)}
.lab-card .lab-bd{flex:1 1 auto;min-width:0}
.lab-card .lab-wk{font-size:12px;color:var(--tx3)}
.lab-card .lab-t{font-size:16px;font-weight:800;color:var(--tx);margin:1px 0 2px}
.lab-card .lab-d{font-size:12.5px;color:var(--tx2);line-height:1.4}
.lab-card .lab-st{flex:0 0 auto;align-self:flex-start;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;
  background:var(--card3);border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.lab-card .lab-st.on{background:var(--mintdk);border-color:#c3ddf5;color:var(--mint)}

/* ---------- 학습(읽는) 카드 ---------- */
.learncard{border:1px solid var(--line)}
.lc-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.lc-head h3{font-size:16px}
.lc-kind{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;
  background:var(--card3);border:1px solid var(--line);color:var(--tx2);letter-spacing:.02em}
.lc-kind.amber{background:var(--amberdk);border-color:#e6d3a8;color:var(--amber)}
.lc-kind.mint{background:var(--mintdk);border-color:#c3ddf5;color:var(--mint)}
.keynums{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 4px}
.keynum{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px;
  background:var(--mintdk);border:1px solid #c3ddf5;color:var(--mint)}
.takeaway{border:1px solid #e6d3a8;background:var(--amberdk)}
.takeaway h3{color:var(--amber)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .dgl .dgl-body{animation:none!important}
  .dgl .spk,.dgl .swt{display:none!important}
}

/* ---------- 미션 시스템 UI ---------- */
.prog-wrap{margin:8px 0 4px}
.prog-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-bottom:5px}
.prog-lbl b{color:var(--mint)}
.prog-bar{height:12px;border-radius:99px;background:var(--card3);border:1px solid var(--line);overflow:hidden}
.prog-bar>i{display:block;height:100%;border-radius:99px;background:var(--mint);transition:width .5s ease}
.prog-bar.full>i{background:var(--green)}

.lockcard{border:1px dashed var(--line2)}
.lockcard.unlocked{border-style:solid;border-color:var(--mint)}
.lockbadge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card3);border:1px solid var(--line);color:var(--tx3)}
.lockbadge.on{background:var(--mintdk);border-color:#c3ddf5;color:var(--mint)}
.lockbadge.pass{background:var(--greendk);border-color:#bfe2cd;color:var(--green)}

.pts{flex:0 0 auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--amberdk);border:1px solid #e6d3a8;color:var(--amber);white-space:nowrap}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.qmeta .p{font-size:12.5px;color:var(--tx3)}
.qmeta .kind{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card3);border:1px solid var(--line);color:var(--tx2)}

.oslot{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;cursor:pointer;min-height:50px;font-size:15px}
.oslot .no{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--mintdk);color:var(--mint);text-align:center;line-height:26px;font-size:13px;font-weight:800}
.oslot.empty{background:transparent;border-style:dashed;color:var(--tx3);cursor:default}
.opool .oitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:48px;padding:10px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:15px}
.opool .oitem .bx{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);text-align:center;line-height:19px;font-size:14px}

/* ---------- 미션 결과·합격증 ---------- */
.scorebig{text-align:center;font-size:52px;font-weight:900;line-height:1;margin:6px 0 2px}
.scorebig.pass{color:var(--green)}
.scorebig.fail{color:var(--amber)}
.scoreunit{text-align:center;font-size:15px;color:var(--tx3);margin-bottom:4px}
.passtag{text-align:center;font-size:16px;font-weight:900;margin:8px 0 2px}
.passtag.pass{color:var(--green)}.passtag.fail{color:var(--amber)}
.revrow{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.revrow.ok{border-left:4px solid var(--green)}
.revrow.no{border-left:4px solid var(--red)}
.revrow.part{border-left:4px solid var(--amber)}
.revrow .ix{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--card3);text-align:center;line-height:24px;font-size:12.5px;font-weight:800;color:var(--tx2)}
.revrow .bd{flex:1 1 auto;min-width:0}
.revrow .qt{font-size:14px;font-weight:700}
.revrow .rs{font-size:12.5px;color:var(--tx3);margin-top:3px}
.revrow .ex{font-size:13px;color:var(--tx2);margin-top:6px;border-top:1px dashed var(--line2);padding-top:6px}
.revrow .rp{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--amber)}

.cert{position:relative;overflow:hidden;border:2px solid var(--gold);border-radius:16px;padding:20px 18px;margin:0 0 12px;
  background:linear-gradient(160deg,#fffaf0,#ffffff);box-shadow:var(--shadow)}
.cert .seal{position:absolute;top:12px;right:14px;font-size:34px;opacity:.9}
.cert .ck{font-size:12px;letter-spacing:.08em;color:var(--gold);font-weight:800}
.cert h2{font-size:20px;margin:6px 0 2px;color:var(--tx)}
.cert .who{font-size:15px;color:var(--tx);margin:10px 0 2px}
.cert .who b{font-size:18px;color:var(--mint)}
.cert table{margin-top:12px}
.cert th{color:var(--tx3)}
.cert td{color:var(--tx);font-weight:600}
.cert .capnote{font-size:12.5px;color:var(--amber);margin-top:12px;background:var(--amberdk);border:1px solid #e6d3a8;border-radius:10px;padding:8px 10px}
.cert .srvnote{font-size:11.5px;color:var(--tx3);margin-top:7px}

.idform label{display:block;font-size:13px;color:var(--tx2);margin:10px 0 5px}
.idform input{width:100%;min-height:48px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-size:16px;color:var(--tx)}
.idform input:focus{outline:none;border-color:var(--mint)}

/* ---------- 3단계 허브(주차 메뉴) 카드 ---------- */
.hub-card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 13px;margin:0 0 11px;
  background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow)}
.hub-card .hub-ic{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--mintdk);color:var(--mint);
  text-align:center;line-height:44px;font-size:22px;font-weight:800}
.hub-card .hub-bd{flex:1 1 auto;min-width:0}
.hub-card .hub-t{font-size:16.5px;font-weight:800}
.hub-card .hub-d{font-size:13px;color:var(--tx2);margin-top:2px}
.hub-card .hub-st{font-size:12px;font-weight:700;margin-top:6px;color:var(--tx3)}
.hub-card .hub-st b{color:var(--mint)}
.hub-card.done .hub-ic{background:var(--greendk);color:var(--green)}
.hub-card.lock .hub-ic{background:var(--card3);color:var(--tx3)}

/* ---------- 실험 결과보고서 입력 폼 ---------- */
.rf-sec{margin:0 0 14px}
.rf-sec .rf-lbl{font-size:15px;font-weight:800;margin:0 0 4px}
.rf-sec .rf-hint{font-size:12px;color:var(--tx3);margin:0 0 7px;line-height:1.45}
.rf-sec textarea{width:100%;padding:11px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line2);
  font-size:14.5px;color:var(--tx);line-height:1.6;resize:vertical;min-height:64px}
.rf-sec textarea:focus{outline:none;border-color:var(--mint)}
.rf-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.rf-meta .fld label{display:block;font-size:12px;color:var(--tx2);margin:0 0 3px}
.rf-meta .fld input{width:100%;min-height:42px;padding:9px 10px;border-radius:9px;background:var(--card);border:1px solid var(--line2);font-size:14.5px;color:var(--tx)}
.rf-meta .fld input:focus{outline:none;border-color:var(--mint)}
.rf-meta .fld input[readonly]{background:var(--card3);color:var(--tx2)}
.rf-tbl{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:13px}
.rf-tbl th,.rf-tbl td{border:1px solid var(--line2);padding:5px 6px;text-align:left;vertical-align:middle}
.rf-tbl th{background:var(--card3);color:var(--tx2);font-weight:700;font-size:12px}
.rf-tbl td.rowlbl{background:var(--card2);font-weight:600;white-space:nowrap;font-size:12px}
.rf-tbl input{width:100%;min-height:34px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:13.5px;color:var(--tx)}
.rf-tbl input:focus{outline:none;border-color:var(--mint)}

/* ---------- A4 미리보기 / 인쇄용 종이 ---------- */
.paper{background:#ffffff;color:#141a20;border:1px solid var(--line2);border-radius:8px;
  padding:26px 24px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.7}
.paper .p-head{text-align:center;border-bottom:2px solid #141a20;padding-bottom:10px;margin-bottom:12px}
.paper .p-title{font-size:19px;font-weight:800;letter-spacing:.02em}
.paper .p-course{font-size:12.5px;color:#3a444e;margin-top:4px}
.paper .p-metatbl{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:12.5px}
.paper .p-metatbl td{border:1px solid #b9c2cc;padding:5px 8px}
.paper .p-metatbl td.k{background:#eef2f6;font-weight:700;white-space:nowrap;width:1%}
.paper h3.p-sh{font-size:14.5px;font-weight:800;margin:15px 0 5px;border-left:4px solid var(--mint);padding-left:8px}
.paper .p-body{white-space:pre-wrap;font-size:13px;color:#20272e;min-height:16px}
.paper .p-empty{color:#9aa6b2;font-style:italic}
.paper table.p-dt{width:100%;border-collapse:collapse;margin:6px 0 2px;font-size:12.5px}
.paper table.p-dt th,.paper table.p-dt td{border:1px solid #8f9aa5;padding:5px 7px;text-align:left}
.paper table.p-dt th{background:#eef2f6;font-weight:700}
.paper .p-cap{font-size:12px;color:#3a444e;margin:4px 0 2px}

/* 교수 확인 표 */
.dash-tbl{width:100%;border-collapse:collapse;font-size:13px}
.dash-tbl th,.dash-tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
.dash-tbl th{color:var(--tx3);font-size:12px;font-weight:600;white-space:nowrap}
.dash-tbl td.c,.dash-tbl th.c{text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card3);border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.pill.ok{background:var(--greendk);border-color:#bfe2cd;color:var(--green)}
.pill.mid{background:var(--mintdk);border-color:#c3ddf5;color:var(--mint)}
.pill.no{background:var(--card3);border-color:var(--line);color:var(--tx3)}

/* ---------- 실험보고서 이미지 업로드 슬롯 ---------- */
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 0}
@media(max-width:420px){.img-grid{grid-template-columns:1fr}}
.img-slot{border:1px solid var(--line2);border-radius:11px;background:var(--card2);padding:9px 9px 10px;display:flex;flex-direction:column}
.img-slot .is-cond{font-size:12.5px;font-weight:800;color:var(--tx);margin:0 0 6px;line-height:1.35}
.img-slot .is-box{position:relative;border:1.5px dashed var(--line2);border-radius:9px;background:var(--card3);min-height:118px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.img-slot .is-box img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain;background:#fff}
.img-slot .is-ph{color:var(--tx3);font-size:12px;text-align:center;padding:16px 8px;line-height:1.5}
.img-slot .is-btns{display:flex;gap:7px;margin-top:8px}
.img-slot .is-btns .btn{flex:1 1 0}
.img-slot input[type=file]{display:none}
.img-note{font-size:12px;color:var(--tx3);margin:8px 0 0;line-height:1.5}
/* A4 미리보기·출력의 이미지 격자 */
.paper .p-imgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.paper .p-imgcell{border:1px solid #b9c2cc;border-radius:6px;overflow:hidden;background:#fff}
.paper .p-imgcap{font-size:11.5px;font-weight:700;color:#20272e;background:#eef2f6;padding:4px 7px;border-bottom:1px solid #b9c2cc}
.paper .p-imgcell img{display:block;width:100%;height:auto;max-height:230px;object-fit:contain;background:#fff}
.paper .p-imgcell .p-imgno{font-size:11px;color:#9aa6b2;font-style:italic;padding:20px 8px;text-align:center}

/* ---------- 실험조 구성 ---------- */
.team-mine{border:1px solid #bfe2cd;background:var(--greendk);border-radius:12px;padding:14px}
.team-mine .tm-no{font-size:22px;font-weight:900;color:var(--green)}
.team-mine .tm-mem{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.team-mine .tm-row{display:flex;align-items:center;gap:8px;font-size:14.5px;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:8px 11px}
.team-mine .tm-row .tm-tag{font-size:11px;font-weight:800;color:var(--mint);background:var(--mintdk);border-radius:999px;padding:1px 8px}
.pick-list{display:flex;flex-direction:column;gap:7px;margin:8px 0 0;max-height:none}
.pick-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:var(--card);cursor:pointer;font-size:14.5px}
.pick-item.on{border-color:var(--mint);background:var(--mintdk)}
.pick-item.dis{opacity:.5;cursor:not-allowed}
.pick-item .pk-box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff}
.pick-item.on .pk-box{background:var(--mint);border-color:var(--mint)}
.pick-item .pk-nm{font-weight:700}
.pick-item .pk-team{font-size:11px;font-weight:800;color:var(--tx2);background:var(--line2);border-radius:999px;padding:1px 9px;margin-left:8px}
.pick-item.dis .pk-team{color:var(--green);background:var(--greendk)}
.pick-item .pk-sid{color:var(--tx3);font-size:12px;margin-left:auto}
.pick-count{font-size:13px;font-weight:800;margin:10px 0 0;color:var(--tx2)}
.pick-count b{color:var(--mint)}

/* ---------- 인쇄(PDF 저장)용 — #printPaper 만 보이게 ---------- */
#printPaper{display:none}
@media print{
  body.printing #topbar,body.printing #checkBanner,body.printing main,
  body.printing #toast,body.printing #tutorial,body.printing #rewardOv{display:none!important}
  body.printing #printPaper{display:block!important}
  body.printing{background:#fff}
  @page{size:A4;margin:16mm}
  #printPaper .paper{border:0;border-radius:0;box-shadow:none;padding:0;font-size:11pt;color:#000}
  #printPaper .paper .p-title{font-size:16pt}
  #printPaper .paper h3.p-sh{font-size:12.5pt}
  #printPaper .paper .p-body{font-size:10.5pt}
  #printPaper .paper .p-imgcell img{max-height:70mm}
}
</style>
</head>
<body>

<div id="checkBanner" hidden></div>

<div id="bgfx"><div class="molfield" id="molfield"></div></div>

<header id="topbar">
  <div class="wrap tb-row">
    <button class="tb-back" id="backBtn" type="button" aria-label="뒤로">←</button>
    <div class="hud-ava" id="coliMini" aria-hidden="true"></div>
    <div class="tb-id">
      <div class="tb-title" id="tbTitle">유전자분석</div>
      <div class="tb-sub" id="tbSub">학습자님</div>
    </div>
    <div class="tb-right">
      <div class="tb-bar"><i id="tbBar"></i></div>
      <div class="tb-barlbl" id="tbBarLbl">학습 0/30</div>
    </div>
  </div>
  <div class="notice" id="notice"><b>실습 보고서 대체 미션 (시제품)</b></div>
</header>

<main>
  <div class="wrap">
    <section id="sc-labs"     class="screen active"></section>
    <section id="sc-lobby"    class="screen"></section>
    <section id="sc-team"     class="screen"></section>
    <section id="sc-report"   class="screen"></section>
    <section id="sc-learn"    class="screen"></section>
    <section id="sc-lquiz"    class="screen"></section>
    <section id="sc-mission"  class="screen"></section>
    <section id="sc-notes"    class="screen"></section>
    <section id="sc-growth"   class="screen"></section>
    <section id="sc-summary"  class="screen"></section>
    <section id="sc-profdash" class="screen"></section>
    <section id="sc-roster"   class="screen"></section>
  </div>
</main>

<div id="rewardOv" aria-hidden="true"></div>
<div id="tutorial"><div class="wrap" id="tutInner"></div></div>
<div id="toast"></div>
<div id="printPaper"></div>

<script src="assets/dgl_sprites.js"></script>
<script src="content.js"></script>
<script>
/* ==========================================================================
 * 게임 본체 — 새 미션 시스템 (2026-08-29 개편)
 *   ① 학습·복습 퀴즈(pool.timed에서 30문) → 미션 해금

/* 실수 배열을 정수로 반올림하되 합을 target 으로 정확히 맞춘다(최대 잔여분 우선) */
function roundToSum(arr, target){
  var floors = arr.map(function(v){ return Math.floor(v); });
  var used = floors.reduce(function(s, v){ return s + v; }, 0);
  var rem = target - used;
  var order = arr.map(function(v, i){ return { i: i, frac: v - Math.floor(v) }; })
    .sort(function(a, b){ return b.frac - a.frac; });
  for(var k = 0; k < order.length && rem > 0; k++){ floors[order[k].i]++; rem--; }
  return floors;
}

        mergeState(dst[k], src[k]);
      }else{
        dst[k] = src[k];

    }
  }
}

function loadRoster(){
  try{
    var raw = localStorage.getItem(ROSTER_KEY);
    if(raw){
      var a = JSON.parse(raw);
      if(Array.isArray(a)){
        return a.filter(function(r){ return r && r.sid && r.name; })
                .map(function(r){ return { sid: String(r.sid).trim(), name: String(r.name).trim() }; });
      }
    }
  }catch(e){}
  return (C && Array.isArray(C.roster)) ? C.roster.slice() : [];
}
/* 명단을 저장한다(중복 학번 제거, 앞뒤 공백 정리). 성공 true / 실패 false. */
function saveRoster(list){
  try{
    var seen = {}, clean = [];
    (list || []).forEach(function(r){
      if(!r) return;
      var sid = String(r.sid == null ? "" : r.sid).trim();
      var name = String(r.name == null ? "" : r.name).trim();
      if(!sid || !name) return;
      if(seen[sid]) return; seen[sid] = true;
      clean.push({ sid: sid, name: name });
    });
    localStorage.setItem(ROSTER_KEY, JSON.stringify(clean));
    return true;
  }catch(e){ return false; }
}
/* 현재 유효한 명단(단일 조회 지점) — 모든 화면이 이걸 통해 명단을 읽는다. */
function getRoster(){ return loadRoster(); }

/* 학번 → 이름(출석부 조회) */
function nameOfSid(sid){
  var list = getRoster();
  for(var i = 0; i < list.length; i++){ if(String(list[i].sid) === String(sid)) return list[i].name; }
  return sid;
}
/* 이 학번이 속한 조(객체) 또는 null */
function teamOf(sid){
  if(!sid) return null;
  var s = String(sid), ts = loadTeams();
  for(var i = 0; i < ts.length; i++){ if(ts[i].members.indexOf(s) !== -1) return ts[i]; }
  return null;
}
/* 조 편성 가능한 학생 목록 — 조기취업 제외 + 이미 조에 속한 사람 제외 + 본인 제외 */
function availableForTeam(mySid){
  var list = getRoster();
  var me = String(mySid || "");
  return list.filter(function(st){
    var s = String(st.sid);
    if(s === me) return false;
    if(isEarly(s)) return false;
    if(teamOf(s)) return false;
    return true;
  });
}
/* 조 생성 — 리더 + 2명. 선착순 번호 부여. 성공 시 조 객체, 실패 시 null */
function makeTeam(leaderSid, otherSids){
  var lead = String(leaderSid || "");
  if(!lead) return null;
  var ts = loadTeams();
  if(ts.length >= TEAM_MAX) return null;                 /* 모든 조가 찼음 */
  if(teamOf(lead)) return teamOf(lead);                  /* 이미 조가 있으면 그대로 */
  var others = (otherSids || []).map(String).filter(function(s){ return s && s !== lead; });
  /* 중복 제거 */
  var uniq = [];
  others.forEach(function(s){ if(uniq.indexOf(s) === -1) uniq.push(s); });
  if(uniq.length !== TEAM_SIZE - 1) return null;         /* 정확히 2명이어야 */
  /* 고른 사람이 그 사이 다른 조에 들어갔는지 재검증 */
  for(var i = 0; i < uniq.length; i++){
    if(isEarly(uniq[i]) || teamOf(uniq[i])) return null;
  }
  var maxNo = 0;
  ts.forEach(function(t){ if(t.no > maxNo) maxNo = t.no; });
  var team = { no: maxNo + 1, members: [lead].concat(uniq) };
  ts.push(team);
  saveTeams(ts);
  return team;
}

      d.meta = o.meta || {}; d.sections = o.sections || {}; d.tables = o.tables || {}; d.images = o.images || {};
      d.submitted = !!o.submitted; d.savedAt = o.savedAt || ""; d.submittedAt = o.submittedAt || "";
    } }
  }catch(e){}
  return d;
}
function saveReport(sid, data){
  try{ localStorage.setItem(reportKey(sid), JSON.stringify(data)); return true; }catch(e){ return false; }
}
/* 보고서에 작성 흔적이 있는가 — 텍스트 섹션 또는 업로드한 사진 */
function reportHasContent(rep){
  if(!rep) return false;
  if(rep.submitted) return true;
  if(rep.sections && Object.keys(rep.sections).some(function(k){ return String(rep.sections[k] || "").trim(); })) return true;
  if(rep.images && Object.keys(rep.images).some(function(k){ return Array.isArray(rep.images[k]) && rep.images[k].some(function(u){ return !!u; }); })) return true;
  return false;
}

/* ---------- 로그인 대조 ----------
 * 명단이 코드에서 빠졌으므로(공개 배포용) 로그인 규칙을 이렇게 바꾼다:
 *   1) 학번은 숫자 8자리 형식이어야 하고, 이름은 비어 있으면 안 된다(형식 검증).
 *   2) 이 기기에 등록된 명단에 그 학번이 있으면 → 이름까지 일치해야 통과(오타 방지).
 *      학번은 있는데 이름이 다르면 거절한다.
 *   3) 명단에 없거나(또는 이 기기에 명단이 없으면) → 형식만 맞으면 통과시키고
 *      입력한 이름·학번을 그대로 제출물에 기록한다. 교수는 대시보드에서
 *      자기가 등록한 명단과 대조한다.
 * 반환: 성공 { sid, name, listed:true|false } / 실패 { error:"사유" }
 */
function findStudent(name, sid){
  var nm = (name || "").replace(/\s/g, "");
  var id = (sid || "").replace(/\s/g, "");
  if(!/^\d{8}$/.test(id)) return { error: "학번은 숫자 8자리로 입력해 주세요." };
  if(!nm) return { error: "이름을 입력해 주세요." };
  var list = getRoster();
  for(var i = 0; i < list.length; i++){
    if(String(list[i].sid) === id){
      if(String(list[i].name).replace(/\s/g, "") === nm) return { sid: id, name: list[i].name, listed: true };
      return { error: "학번은 명단에 있는데 이름이 다릅니다. 이름을 다시 확인해 주세요." };
    }
  }
  return { sid: id, name: nm, listed: false };
}
function checkProf(name, pid){
  if(!C || !C.prof) return false;
  return (C.prof.name || "").replace(/\s/g, "") === (name || "").replace(/\s/g, "")
      && String(C.prof.pid) === (pid || "").replace(/\s/g, "");
}
/* 신원 적용 + 진도 로드 + 세션 저장 */
function applyIdentity(role, sid, name){
  state = loadProgress(role, sid, name);
  saveSession();
}

/* ==========================================================================
 * 콘텐츠 파생값 — pool(timed·reason) 중심. pool 없으면 방어.
 * ========================================================================*/
var POOL = null;
var POOL_TIMED = [];
var POOL_TIMED_BY_ID = {};
var POOL_REASON = [];
var POOL_REASON_BY_ID = {};
function hasPool(){ return POOL_TIMED.length > 0 && POOL_REASON.length > 0; }
function buildDerived(){
  POOL = (AW && AW.pool && typeof AW.pool === "object") ? AW.pool : null;
  POOL_TIMED = (POOL && Array.isArray(POOL.timed)) ? POOL.timed.filter(function(q){
    return q && q.qid && q.type && (q.answer !== undefined) && q.points && q.limitSec;
  }) : [];
  POOL_TIMED_BY_ID = {};
  POOL_TIMED.forEach(function(q){ POOL_TIMED_BY_ID[q.qid] = q; });

  /* 추리 풀 — ref 항목은 cases[] 원본을 끌어와 points 를 붙인다(w02 는 reason 에 전체가 담겨 있다). */
  var caseById = {};
  ((AW && AW.cases) || []).forEach(function(cs){ caseById[cs.caseId] = cs; });
  POOL_REASON = [];
  (POOL && Array.isArray(POOL.reason) ? POOL.reason : []).forEach(function(r){
    if(!r || !r.caseId) return;
    var full;
    if(r.clues && r.suspects && r.answer){
      full = r;                                  /* 풀에 전체가 담긴 신규 사건 */
    }else if(caseById[r.caseId]){
      full = {};                                 /* cases[] 원본을 얕게 복제 */
      for(var k in caseById[r.caseId]){ if(Object.prototype.hasOwnProperty.call(caseById[r.caseId], k)) full[k] = caseById[r.caseId][k]; }
      full.points = r.points || 15;
    }else{ return; }
    if(!full.points) full.points = r.points || 15;
    if(full.clues && full.suspects && full.answer) POOL_REASON.push(full);
  });
  POOL_REASON_BY_ID = {};
  POOL_REASON.forEach(function(c){ POOL_REASON_BY_ID[c.caseId] = c; });
}
function UNLOCK_N(){ return (POOL && POOL.info && POOL.info.learnUnlockCount) || 30; }
function MISSION_PASS(){ return (POOL && POOL.info && POOL.info.mission && POOL.info.mission.passPoints) || 70; }
function MISSION_TIMED(){ return (POOL && POOL.info && POOL.info.mission && POOL.info.mission.timedCount) || 8; }
function MISSION_REASON(){ return (POOL && POOL.info && POOL.info.mission && POOL.info.mission.reasonCount) || 2; }

/* ==========================================================================
 * checkContent() — 로드 시 자동 실행되는 자체 검증 (새 화면·pool 반영)
 * ========================================================================*/
var SCREENS = ["labs","lobby","team","report","learn","lquiz","mission","notes","growth","summary","profdash","roster"];
var NAV_EDGES = {
  labs:     ["lobby","profdash","team"],
  lobby:    ["labs","report","learn","lquiz","mission","notes","growth","summary"],
  team:     ["labs"],
  report:   ["lobby","profdash"],
  learn:    ["lquiz","lobby"],
  lquiz:    ["mission","lobby"],
  mission:  ["lobby","notes","lquiz"],
  notes:    ["lquiz","lobby"],
  growth:   ["lobby","notes"],
  summary:  ["lobby"],
  profdash: ["labs","report","lobby","roster"],
  roster:   ["profdash"]
};
function checkContent(){
  var errs = [], warns = [];
  function E(m){ errs.push(m); }
  function W(m){ warns.push(m); }

  if(!C){ E("content.js 를 읽지 못했습니다 (window.GAME_CONTENT 없음). index.html 과 같은 폴더에 content.js 가 있어야 합니다."); return { errs: errs, warns: warns, n: 0 }; }
  if(!C.meta || !C.meta.title) E("meta.title 이 없습니다");

  /* --- 활성 주차(AW) pool 검증 (없으면 경고 · 구버전 방어) --- */
  var n = 0;
  var AP = AW && AW.pool;
  if(!AP || !Array.isArray(AP.timed) || !Array.isArray(AP.reason)){
    W("활성 주차(" + ACTIVE_WEEK + ") pool(timed·reason)이 없습니다 — 학습·복습 퀴즈와 미션이 비활성화됩니다.");
  }else{
    var seenQ = {}, seenText = {};
    AP.timed.forEach(function(q, i){
      var tag = "pool.timed[" + i + "] " + (q && q.qid ? q.qid : "(qid 없음)");
      if(!q.qid) E(tag + " : qid 없음");
      else if(seenQ[q.qid]) E(tag + " : qid 중복"); else seenQ[q.qid] = true;
      var key = String(q.q || "").replace(/\s/g, "");
      if(!key) E(tag + " : 지문(q) 비었음");
      else if(seenText[key]) E(tag + " : 지문이 " + seenText[key] + " 와 중복"); else seenText[key] = q.qid;
      if(!q.explain || !String(q.explain).trim()) E(tag + " : 해설(explain) 누락");
      if(!q.source || !String(q.source).trim()) E(tag + " : 출처(source) 누락 — 지어낸 문항 방지 검사");
      if(!q.limitSec || q.limitSec <= 0) E(tag + " : limitSec 없음");
      if(!q.points || q.points <= 0) E(tag + " : points 없음");
      if([1,2,3].indexOf(q.level) < 0) E(tag + " : level 이 1~3 이 아닙니다");
      if(q.type === "mc"){
        if(!Array.isArray(q.choices) || q.choices.length < 2) E(tag + " : choices 부족");
        else if(typeof q.answer !== "number" || q.answer < 0 || q.answer >= q.choices.length) E(tag + " : answer 범위 밖");
      }else if(q.type === "ox"){
        if(typeof q.answer !== "boolean") E(tag + " : OX answer 는 true/false");
      }else if(q.type === "num"){
        if(typeof q.answer !== "number" || !isFinite(q.answer)) E(tag + " : num answer 가 숫자가 아님");
      }else if(q.type === "order"){
        if(!Array.isArray(q.steps) || q.steps.length < 2) E(tag + " : steps 부족");
        if(!Array.isArray(q.answer) || q.answer.length !== (q.steps || []).length) E(tag + " : order answer 길이 불일치");
        else{
          var sortd = q.answer.slice().sort(function(a,b){return a-b;});
          for(var z = 0; z < sortd.length; z++){ if(sortd[z] !== z){ E(tag + " : order answer 가 steps 인덱스의 순열이 아님"); break; } }
        }
      }else{
        E(tag + " : 알 수 없는 type(" + q.type + ")");
      }
    });
    var minTimed = MISSION_TIMED();
    if(AP.timed.length < minTimed) E("pool.timed 가 " + AP.timed.length + "문 — 미션 시간제한 " + minTimed + "문에 못 미칩니다");

    /* 추리 풀 — ref 는 cases[] 에 실재해야 한다(w02 는 reason 에 전체가 담겨 있다) */
    var caseIds = {};
    ((AW && AW.cases) || []).forEach(function(cs){ caseIds[cs.caseId] = cs; });
    var okReason = 0;
    AP.reason.forEach(function(r, i){
      var tag = "pool.reason[" + i + "] " + (r && r.caseId ? r.caseId : "(caseId 없음)");
      if(!r.caseId){ E(tag + " : caseId 없음"); return; }
      var full = (r.clues && r.suspects && r.answer) ? r : caseIds[r.caseId];
      if(!full){ E(tag + " : 전체 정의도 없고 cases[] 에도 없습니다 — 풀 수 없는 추리 항목"); return; }
      if(!Array.isArray(full.clues) || full.clues.length < 3) E(tag + " : 단서 3개 미만");
      if(!Array.isArray(full.suspects) || full.suspects.length < 2) E(tag + " : 원인 후보 2개 미만");
      if(!full.answer || !full.answer.suspect) E(tag + " : answer.suspect 없음");
      else{
        var sus = (full.suspects || []).filter(function(s){ return s.id === full.answer.suspect; })[0];
        if(!sus) E(tag + " : answer.suspect 가 suspects 에 없습니다");
        else if(sus.correct !== true) E(tag + " : 정답 후보의 correct 가 true 가 아닙니다");
      }
      var ev = (full.answer || {}).evidence || [];
      if(ev.length !== 2) E(tag + " : answer.evidence 는 2개여야 합니다 (현재 " + ev.length + ")");
      okReason++;
    });
    var minR = MISSION_REASON();
    if(okReason < minR) E("풀 수 있는 추리 항목이 " + okReason + "건 — 미션 추리 " + minR + "문에 못 미칩니다");
    n = AP.timed.length;
  }

  /* --- roster(출석부) · prof(교수) · report(보고서 양식) 검증 ---
   * 🔒 명단(학번·이름)은 개인정보 보호를 위해 소스코드에서 뺐다. C.roster 가
   *    비어 있는 것이 정상이므로 비어 있어도 오류가 아니다(명단은 교수가
   *    앱 「출석부 관리」에서 등록해 localStorage 에 저장한다).
   *    C.roster 에 값이 남아 있는 경우에만 형식(학번·이름·중복)을 점검한다. */
  if(Array.isArray(C.roster) && C.roster.length){
    var seenSid = {};
    C.roster.forEach(function(r, i){
      if(!r || !r.sid || !r.name) E("roster[" + i + "] : 학번(sid)·이름(name)이 비었습니다");
      else if(seenSid[r.sid]) E("roster[" + i + "] : 학번 중복 " + r.sid); else seenSid[r.sid] = true;
    });
  }
  if(!C.prof || !C.prof.name || !C.prof.pid) E("prof(교수 로그인 이름·교번)이 없습니다");
  if(AW && !AW.report){ W("활성 주차(" + ACTIVE_WEEK + ")에 report(보고서 양식)가 없습니다 — 결과보고서 작성을 열 수 없습니다."); }
  else if(AW && AW.report){
    if(!Array.isArray(AW.report.sections) || AW.report.sections.length === 0) E("report.sections 가 없습니다");
    else{
      var seenSecKey = {};
      AW.report.sections.forEach(function(s, i){
        var tag = "report.sections[" + i + "]" + (s && s.key ? " " + s.key : "");
        if(!s || !s.key) E(tag + " : key 없음");
        else if(seenSecKey[s.key]) E(tag + " : key 중복"); else seenSecKey[s.key] = true;
        if(!s.label) E(tag + " : label 없음");
        if(s.type === "images"){
          if(!Array.isArray(s.conditions) || s.conditions.length === 0) E(tag + " : type=images 인데 conditions(조건 목록)가 없습니다");
        }
      });
    }
    if(!Array.isArray(AW.report.meta) || AW.report.meta.length === 0) E("report.meta 가 없습니다");
  }

  /* --- labs(7개 실습 메뉴) 검증 --- */
  if(!Array.isArray(C.labs) || C.labs.length === 0){
    E("labs 배열이 없습니다 — 7개 실습 메뉴를 만들 수 없습니다.");
  }else{
    var seenLab = {};
    C.labs.forEach(function(l, i){
      var tag = "labs[" + i + "] " + (l && l.id ? l.id : "(id 없음)");
      if(!l.id) E(tag + " : id 없음");
      else if(seenLab[l.id]) E(tag + " : id 중복"); else seenLab[l.id] = true;
      if(!l.title) E(tag + " : title 없음");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(l.unlockDate || "")) E(tag + " : unlockDate 형식(YYYY-MM-DD) 오류");
      if(typeof l.ready !== "boolean") E(tag + " : ready(true/false) 없음");
    });
    if(!seenLab[ACTIVE_WEEK]) E("labs 에 활성 주차(" + ACTIVE_WEEK + ") 실습이 없습니다");
  }

  SCREENS.forEach(function(s){
    if(!document.getElementById("sc-" + s)) E("화면 sc-" + s + " 가 HTML 에 없습니다");
  });
  var seen = { labs: true }, queue = ["labs"];
  while(queue.length){
    var cur0 = queue.shift();
    (NAV_EDGES[cur0] || []).forEach(function(nx){
      if(SCREENS.indexOf(nx) < 0){ E("이동 대상 화면 '" + nx + "' 가 정의돼 있지 않습니다"); return; }
      if(!seen[nx]){ seen[nx] = true; queue.push(nx); }
    });
  }
  SCREENS.forEach(function(s){ if(!seen[s]) E("화면 '" + s + "' 는 로비에서 도달할 수 없습니다"); });

  return { errs: errs, warns: warns, n: n };
}
function runCheck(){
  var r;
  try{ r = checkContent(); }
  catch(e){ r = { errs: ["checkContent 실행 중 오류: " + e.message], warns: [], n: 0 }; }
  if(r.errs.length){
    var b = $("checkBanner");
    b.hidden = false;
    b.innerHTML = "<b>⚠ 콘텐츠 검증에서 " + r.errs.length + "건이 걸렸습니다.</b> 아래 항목을 고친 뒤 다시 여십시오.<ul>" +
      r.errs.slice(0, 12).map(function(m){ return "<li>" + esc(m) + "</li>"; }).join("") +
      (r.errs.length > 12 ? "<li>… 외 " + (r.errs.length - 12) + "건 (콘솔 참조)</li>" : "") + "</ul>";
    if(window.console){
      console.error("checkContent 실패 — " + r.errs.length + "건");
      r.errs.forEach(function(m){ console.error("  · " + m); });
      r.warns.forEach(function(m){ console.warn("  (경고) " + m); });
    }
  }else if(window.console){
    console.log("checkContent OK — timed " + r.n + "문 · reason " + POOL_REASON.length + "건");
    r.warns.forEach(function(m){ console.warn("  (경고) " + m); });
  }
  return r;
}

 *     1) content.js 의 해당 lab 을 ready:true 로 바꾼다.
 *     2) 그 lab 의 미션 콘텐츠를 붙이고(byWeek.wNN 또는 weekPack()에 연결), 로비/미션이 읽게 한다.

  if(!lab || LABS_WITH_CONTENT.indexOf(lab.id) === -1) return false;   /* 콘텐츠가 붙은 실습만 */

  return !!lab.ready && (TEST_OPEN_ALL || today() >= lab.unlockDate);

  }else{

  h += '</div></div>';

  /* 한 학기 실습 단계 (안내 목록) */
  h += '<div class="card"><h3>한 학기 실습 단계 <span class="small">7단계 중 현재 ' + esc(lab.weekLabel || "") + '</span></h3>';

/* ==========================================================================
 * 실험조 구성 — 로그인 학생이 조원 2명을 골라 3명 한 조를 만든다(선착순 번호)
 *   저장: localStorage TEAMS_KEY. 이 기기 로컬 — 여러 기기에서 짜면 합쳐지지 않는다.
 * ========================================================================*/
RENDER.team = function(){
  var sc = $("sc-team");
  var mySid = state.studentId || "";
  var localNote = '<p class="small" style="margin-top:14px">※ 조 편성은 <b>이 기기</b>에만 저장됩니다. 여러 학생이 각자 기기에서 따로 짜면 합쳐지지 않습니다(전체 공유는 서버 단계에서). 한 기기(예: 실습실 공용 PC)에서 함께 짜는 것을 권합니다.</p>';
  var h = "";
  h += '<button class="btn sm ghost" type="button" data-go="labs" style="margin-bottom:10px;text-align:left">← 실습 목록으로</button>';
  h += '<h2 class="sc-h">👥 실험조 구성</h2>';
  h += '<p class="sc-p">한 조는 3명입니다. 총 ' + TEAM_MAX + '개 조까지 만들 수 있고, 조 번호는 먼저 만든 조부터 1조·2조… 선착순으로 정해집니다.</p>';

  /* 교수·비로그인 방어 */
  if(state.role !== "student" || !mySid){
    h += '<div class="card"><p class="muted">학생으로 로그인하면 실험조를 구성할 수 있습니다.' + (state.role==="prof" ? ' (교수 미리보기에서는 편성만 확인됩니다.)' : '') + '</p></div>';
    h += teamStatusCard();
    h += localNote;
    sc.innerHTML = h; bindGo(sc); return;
  }

  /* 조기취업 면제 */
  if(meIsEarly()){
    h += '<div class="card tight" style="border-color:#bfe2cd;background:var(--greendk)"><div class="small" style="color:var(--green)">🎓 <b>조기 취업 면제 대상</b>입니다. 실험조 편성 의무가 없어 명단에서 제외됩니다.</div></div>';
    h += teamStatusCard();
    h += localNote;
    sc.innerHTML = h; bindGo(sc); return;
  }

  var myTm = teamOf(mySid);
  if(myTm){
    /* 이미 조가 있으면 내 조를 보여준다 */
    h += '<div class="team-mine"><div class="tm-no">' + myTm.no + '조</div>';
    h += '<div class="tm-mem">';
    myTm.members.forEach(function(s){
      var isMe = String(s) === String(mySid);
      h += '<div class="tm-row"><span class="tm-tag">' + (isMe ? '나' : '조원') + '</span><b>' + esc(nameOfSid(s)) + '</b><span class="pk-sid" style="margin-left:auto;color:var(--tx3);font-size:12px">' + esc(String(s)) + '</span></div>';
    });
    h += '</div></div>';
    h += '<p class="small" style="margin-top:12px">조가 편성되었습니다. 보고서 머리말의 "조" 칸에 <b>' + myTm.no + '조</b>가 자동으로 채워집니다.</p>';
    h += '<button class="btn sm danger center" type="button" id="teamRebuild" style="margin-top:4px">조 다시 짜기</button>';
    h += '<p class="small" style="margin:2px 0 0;color:var(--tx3)">※ 다시 짜면 우리 조가 해체되고 조원 3명이 모두 미배정 상태가 됩니다. 새로 만들면 선착순 번호를 다시 받습니다.</p>';
    h += teamStatusCard();
    h += localNote;
    sc.innerHTML = h; bindGo(sc);
    if($("teamRebuild")) $("teamRebuild").onclick = function(){
      askConfirm(myTm.no + "조를 해체하고 다시 짜시겠어요?\n조원 3명이 모두 미배정 상태가 되고, 새로 만들면 조 번호를 다시 받습니다.", function(){
        disbandTeam(myTm.no);
        ctx.teamPick = [];
        toast(myTm.no + "조를 해체했습니다. 조원을 다시 골라 주세요.");
        RENDER.team();
      });
    };
    return;
  }

  /* 모든 조가 찼는가 */
  if(teamsFull()){
    h += '<div class="card"><h3>모든 조가 구성되었습니다</h3><p class="muted">' + TEAM_MAX + '개 조가 모두 편성되어 더 만들 수 없습니다. 조 배정에 문제가 있으면 담당 교수님께 문의하세요.</p></div>';
    h += teamStatusCard();
    h += localNote;
    sc.innerHTML = h; bindGo(sc); return;
  }

  /* ---------- 조 만들기 ---------- */
  var avail = availableForTeam(mySid);
  if(!ctx.teamPick) ctx.teamPick = [];
  /* 그 사이 조가 찬 학생은 선택 목록에서 사라지므로 picked 정리 */
  var availSids = {};
  avail.forEach(function(st){ availSids[String(st.sid)] = true; });
  ctx.teamPick = ctx.teamPick.filter(function(s){ return availSids[s]; });

  var nextNo = (function(){ var m = 0; loadTeams().forEach(function(t){ if(t.no > m) m = t.no; }); return m + 1; })();
  h += '<div class="card"><h3>조 만들기 <span class="small">이 조는 ' + nextNo + '조가 됩니다</span></h3>';
  h += '<p class="sc-p" style="margin:0 0 6px">나(<b>' + esc(state.studentName || "") + '</b>)와 함께할 <b>조원 2명</b>을 명단에서 고르세요. 고른 2명도 자동으로 이 조에 편성됩니다.</p>';

  if(avail.length < TEAM_SIZE - 1){
    h += '<p class="muted" style="margin:8px 0">함께 조를 짤 수 있는 학생이 ' + avail.length + '명뿐입니다(조기취업·이미 편성된 학생 제외). 조를 만들려면 최소 2명이 필요합니다.</p>';
    h += '</div>';
    h += teamStatusCard();
    h += localNote;
    sc.innerHTML = h; bindGo(sc); return;
  }

  /* 이미 다른 조에 배정된 학생(본인·조기취업 제외) — 목록에 남기되 비활성 + N조 표시 */
  var roster0 = getRoster();
  var assigned = roster0.filter(function(st){
    var s = String(st.sid);
    if(s === String(mySid)) return false;
    if(isEarly(s)) return false;
    return !!teamOf(s);
  });
  h += '<div class="pick-list" id="pickList">';
  avail.forEach(function(st){
    var s = String(st.sid);
    var on = ctx.teamPick.indexOf(s) !== -1;
    h += '<div class="pick-item' + (on ? ' on' : '') + '" data-pick="' + esc(s) + '">';
    h += '<span class="pk-box">' + (on ? '✓' : '') + '</span>';
    h += '<span class="pk-nm">' + esc(st.name) + '</span>';
    h += '<span class="pk-sid">' + esc(s) + '</span>';
    h += '</div>';
  });
  assigned.forEach(function(st){
    var s = String(st.sid);
    var tm = teamOf(s);
    h += '<div class="pick-item dis" aria-disabled="true" title="이미 편성된 학생입니다">';
    h += '<span class="pk-box"></span>';
    h += '<span class="pk-nm">' + esc(st.name) + '</span>';
    h += '<span class="pk-team">' + (tm ? tm.no + '조' : '배정됨') + '</span>';
    h += '<span class="pk-sid">' + esc(s) + '</span>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="pick-count" id="pickCount"></div>';
  h += '<button class="btn primary center" type="button" id="teamMake" style="margin-top:12px">조 만들기 확정</button>';
  h += '</div>';
  h += teamStatusCard();
  h += localNote;
  sc.innerHTML = h;
  bindGo(sc);

  function refreshPick(){
    var cnt = ctx.teamPick.length;
    var cel = $("pickCount");
    if(cel) cel.innerHTML = '선택 <b>' + cnt + '</b> / ' + (TEAM_SIZE - 1) + '명' + (cnt === TEAM_SIZE - 1 ? ' — 준비 완료!' : (cnt > TEAM_SIZE - 1 ? ' — 2명만 고르세요' : ''));
    var mk = $("teamMake");
    if(mk) mk.disabled = (cnt !== TEAM_SIZE - 1);
  }
  sc.querySelectorAll("[data-pick]").forEach(function(el){
    el.onclick = function(){
      var s = el.getAttribute("data-pick");
      var i = ctx.teamPick.indexOf(s);
      if(i !== -1){ ctx.teamPick.splice(i, 1); el.classList.remove("on"); el.querySelector(".pk-box").textContent = ""; }
      else{
        if(ctx.teamPick.length >= TEAM_SIZE - 1){ toast("조원은 2명까지만 고를 수 있어요."); return; }
        ctx.teamPick.push(s); el.classList.add("on"); el.querySelector(".pk-box").textContent = "✓";
      }
      refreshPick();
    };
  });
  refreshPick();
  if($("teamMake")) $("teamMake").onclick = function(){
    if(ctx.teamPick.length !== TEAM_SIZE - 1){ toast("조원 2명을 골라 주세요."); return; }
    var team = makeTeam(mySid, ctx.teamPick.slice());
    if(!team){ toast("조를 만들지 못했습니다. 고른 학생이 방금 다른 조에 편성되었거나 모든 조가 찼습니다."); ctx.teamPick = []; RENDER.team(); return; }
    ctx.teamPick = [];
    toast(team.no + "조가 만들어졌습니다.");
    if(!reduced) showReward({ face:"celebrate", kicker:"실험조 편성", title:team.no + "조 완성", sub:team.members.map(function(s){ return nameOfSid(s); }).join(" · "), hold:2400 });
    RENDER.team();
  };
};
/* 편성 현황 요약 카드(조 목록) — 공용 */

/* ==========================================================================
 * 실험 결과보고서 — 입력 폼 · A4 미리보기 · 워드(.doc)/PDF 다운로드
 *   ctx.report = { sid, name, readonly, view("edit"|"preview"), data }
 *   저장: localStorage reportKey(sid). 외부 라이브러리 없이 Blob(.doc)·window.print(PDF).
 * ========================================================================*/
function reportDef(){ return (AW && AW.report) ? AW.report : null; }
function reportMetaMap(def, sid, name, data){
  /* 화면·출력에 쓸 머리말 값 표(고정값 + 학생 입력 date/team + 로그인 sid/name) */
  var m = {};
  (def.meta || []).forEach(function(f){ m[f.key] = { label: f.label, value: f.value || "", fixed: !!f.fixed }; });
  if(m.date) m.date.value = (data.meta && data.meta.date) || m.date.value || curLab().unlockDate || "";
  if(m.team){ var tm = teamOf(sid); m.team.value = (data.meta && data.meta.team) || (tm ? tm.no + "조" : "") || ""; }
  if(m.sid)  m.sid.value = sid || "";
  if(m.name) m.name.value = name || "";
  return m;
}
function reportFileBase(sid){ return "CellCulture_Report_" + (sid || "student"); }

/* 이미지 파일 → 가로 최대 maxW 로 리사이즈 + JPEG 압축 → base64 dataURL. 순수 브라우저 API. */
function resizeImageFile(file, maxW, cb){
  if(!file || !/^image\//.test(file.type || "")){ cb(null, "이미지 파일이 아닙니다."); return; }
  var reader = new FileReader();
  reader.onerror = function(){ cb(null, "파일을 읽지 못했습니다."); };
  reader.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null, "이미지를 여는 데 실패했습니다."); };
    img.onload = function(){
      try{
        var w = img.naturalWidth || img.width, ht = img.naturalHeight || img.height;
        if(!w || !ht){ cb(null, "이미지 크기를 알 수 없습니다."); return; }
        var scale = w > maxW ? (maxW / w) : 1;
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(ht * scale));
        var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        var g = cv.getContext("2d");
        g.fillStyle = "#ffffff"; g.fillRect(0, 0, cw, ch);   /* 투명 PNG 대비 흰 배경 */
        g.drawImage(img, 0, 0, cw, ch);
        cb(cv.toDataURL("image/jpeg", 0.82), null);
      }catch(e){ cb(null, "이미지 변환 중 오류: " + (e && e.message ? e.message : e)); }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* 이미지 업로드 섹션(배양 전/후) — 조건별 슬롯 그리드(편집 폼용) */
function buildImageSlots(s, data, readonly){
  var conds = s.conditions || [];
  var arr = (data.images && data.images[s.key]) || [];
  var h = '<div class="img-grid">';
  conds.forEach(function(cond, i){
    var durl = arr[i] || "";
    var iid = "imgf_" + s.key + "_" + i;
    h += '<div class="img-slot">';
    h += '<div class="is-cond">' + (i + 1) + ') ' + esc(cond) + '</div>';
    h += '<div class="is-box">' + (durl
        ? '<img src="' + durl + '" alt="' + esc(cond) + '">'
        : '<div class="is-ph">사진 없음<br>' + (readonly ? '(미첨부)' : '아래 버튼으로 올려요') + '</div>') + '</div>';
    if(!readonly){
      h += '<input type="file" accept="image/*" id="' + iid + '" data-imgfile="' + esc(s.key) + '" data-idx="' + i + '">';
      h += '<div class="is-btns"><button class="btn sm" type="button" data-imgpick="' + iid + '">' + (durl ? '📷 사진 바꾸기' : '📷 사진 올리기') + '</button>';
      if(durl) h += '<button class="btn sm ghost" type="button" data-imgdel="' + esc(s.key) + '" data-idx="' + i + '" style="flex:0 0 auto">삭제</button>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  if(!readonly) h += '<div class="img-note">사진은 자동으로 가로 최대 1000px로 줄여 저장합니다(용량 절약). 큰 원본은 그대로 저장되지 않습니다.</div>';
  return h;
}

/* A4 보고서 본문 HTML — 미리보기·인쇄·워드에서 공용 */
function buildReportHTML(sid, name, data){
  var def = reportDef();
  if(!def) return '<div class="p-body p-empty">보고서 양식이 없습니다.</div>';
  var lab = curLab();
  var m = reportMetaMap(def, sid, name, data);
  var sec = data.sections || {};
  var tbl = data.tables || {};
  function val(k){ return (m[k] && m[k].value) ? esc(m[k].value) : "—"; }
  var h = "";
  h += '<div class="p-head"><div class="p-title">실험 결과보고서</div>';
  h += '<div class="p-course">' + esc(def.course || C.meta.course || "유전자분석") + '</div></div>';
  /* 머리말 표 */
  h += '<table class="p-metatbl">';
  h += '<tr><td class="k">과목</td><td>' + esc((m.course && m.course.value) || "유전자분석") + '</td><td class="k">주차</td><td>' + esc((m.week && m.week.value) || lab.weekLabel || "") + '</td></tr>';
  h += '<tr><td class="k">실험명</td><td colspan="3">' + esc((m.expName && m.expName.value) || def.experimentName || lab.title || "") + '</td></tr>';
  h += '<tr><td class="k">실험일자</td><td>' + val("date") + '</td><td class="k">조</td><td>' + val("team") + '</td></tr>';
  h += '<tr><td class="k">학번</td><td>' + val("sid") + '</td><td class="k">이름</td><td>' + val("name") + '</td></tr>';
  h += '</table>';
  /* 섹션 */
  (def.sections || []).forEach(function(s){
    var lbl = (s.no ? s.no + '. ' : '') + s.label;
    h += '<h3 class="p-sh">' + esc(lbl) + '</h3>';
    if(s.type === "images"){
      var conds = s.conditions || [];
      var arr = (data.images && data.images[s.key]) || [];
      h += '<div class="p-imgrid">';
      conds.forEach(function(cond, i){
        var durl = arr[i] || "";
        h += '<div class="p-imgcell"><div class="p-imgcap">' + (i + 1) + ') ' + esc(cond) + '</div>';
        h += durl ? '<img src="' + durl + '" alt="' + esc(cond) + '">' : '<div class="p-imgno">(미첨부)</div>';
        h += '</div>';
      });
      h += '</div>';
      return;
    }
    var txt = String(sec[s.key] || "").trim();
    h += '<div class="p-body' + (txt ? '' : ' p-empty') + '">' + (txt ? esc(txt) : "(미작성)") + '</div>';
    if(s.table){
      var T = s.table, rows = T.rowLabels || [], cols = T.cols || [];
      h += (T.caption ? '<div class="p-cap">' + esc(T.caption) + '</div>' : '');
      h += '<table class="p-dt"><tr>';
      cols.forEach(function(c){ h += '<th>' + esc(c) + '</th>'; });
      h += '</tr>';
      rows.forEach(function(rl, ri){
        h += '<tr><td>' + esc(rl) + '</td>';
        var rowvals = (tbl[s.key] && tbl[s.key][ri]) || [];
        for(var ci = 1; ci < cols.length; ci++){
          var cv = rowvals[ci - 1];
          h += '<td>' + (cv ? esc(cv) : "") + '</td>';
        }
        h += '</tr>';
      });
      h += '</table>';
    }
  });
  return h;
}

/* 워드(.doc) 다운로드 — application/msword Blob (외부 라이브러리 없음) */
function downloadReportWord(sid, name, data){
  var body = buildReportHTML(sid, name, data);
  var css = "@page{size:A4;margin:20mm} body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:11pt;line-height:1.7;color:#000}"
    + " .p-head{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}"
    + " .p-title{font-size:16pt;font-weight:bold} .p-course{font-size:10.5pt;color:#333;margin-top:4px}"
    + " .p-metatbl{border-collapse:collapse;width:100%;margin-bottom:14px;font-size:10.5pt}"
    + " .p-metatbl td{border:1px solid #888;padding:5px 8px} .p-metatbl td.k{background:#eee;font-weight:bold}"
    + " h3.p-sh{font-size:12.5pt;margin:14px 0 4px;border-left:4px solid #2b6cb0;padding-left:7px}"
    + " .p-body{white-space:pre-wrap;font-size:10.5pt} .p-empty{color:#999;font-style:italic}"
    + " table.p-dt{border-collapse:collapse;width:100%;margin:6px 0;font-size:10.5pt}"
    + " table.p-dt th,table.p-dt td{border:1px solid #666;padding:5px 7px;text-align:left} table.p-dt th{background:#eee}"
    + " .p-cap{font-size:10pt;color:#333;margin:4px 0}"
    + " .p-imgrid{margin:6px 0} .p-imgcell{border:1px solid #999;margin:0 0 8px;display:inline-block;width:47%;vertical-align:top}"
    + " .p-imgcap{font-size:9.5pt;font-weight:bold;background:#eee;padding:3px 6px;border-bottom:1px solid #999}"
    + " .p-imgcell img{display:block;width:100%;max-width:280px;height:auto}"
    + " .p-imgno{font-size:9.5pt;color:#999;font-style:italic;padding:14px 8px;text-align:center}";
  var html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>"
    + "<head><meta charset='utf-8'><title>실험 결과보고서</title><style>" + css + "</style></head><body>" + body + "</body></html>";
  try{
    var blob = new Blob(["﻿", html], { type: "application/msword" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = reportFileBase(sid) + ".doc";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
    toast("워드 파일을 내려받았습니다: " + reportFileBase(sid) + ".doc");
  }catch(e){
    toast("이 브라우저에서는 파일 다운로드가 막혀 있습니다. Chrome/Edge에서 파일을 직접 열어 주세요.");
  }
}
/* PDF — 인쇄 대화상자에서 'PDF로 저장' */
function printReportPDF(sid, name, data){
  var pp = $("printPaper");
  pp.innerHTML = '<div class="paper">' + buildReportHTML(sid, name, data) + '</div>';
  document.body.classList.add("printing");
  var cleanup = function(){ document.body.classList.remove("printing"); pp.innerHTML = ""; window.onafterprint = null; };
  window.onafterprint = cleanup;
  setTimeout(function(){ try{ window.print(); }catch(e){ cleanup(); toast("인쇄를 열 수 없습니다."); } }, 60);
  /* 일부 브라우저는 onafterprint 를 안 쏘므로 보조 정리 */
  setTimeout(function(){ if(document.body.classList.contains("printing")) cleanup(); }, 12000);
}

RENDER.report = function(){
  var def = reportDef();
  var sc = $("sc-report");
  if(!ctx.report){ ctx.report = { sid: state.studentId, name: state.studentName, readonly: state.role === "prof", view: "edit" }; }
  var R = ctx.report;
  if(!R.data){ R.data = loadReport(R.sid); }
  var data = R.data;
  var readonly = !!R.readonly;

  if(!def){
    sc.innerHTML = '<h2 class="sc-h">실험 결과보고서</h2><div class="card"><p class="muted">이 주차에는 보고서 양식이 없습니다.</p></div>' +
      '<button class="btn ghost center" type="button" data-go="' + (state.role==="prof"?"profdash":"lobby") + '">돌아가기</button>';
    bindGo(sc); return;
  }

  if(R.view === "preview"){ renderReportPreview(sc, R, def); return; }

  /* ---------- 편집 폼 ---------- */
  var lab = curLab();
  var m = reportMetaMap(def, R.sid, R.name, data);
  var h = "";
  h += '<button class="btn sm ghost" type="button" id="rpBack" style="margin-bottom:10px;text-align:left">← ' + (state.role==="prof"?"확인 대시보드로":"실습 허브로") + '</button>';
  h += '<h2 class="sc-h">📝 실험 결과보고서 — ' + esc(def.title || lab.title || "") + '</h2>';
  h += '<p class="sc-p">' + esc(def.gradeNote || "") + (readonly ? ' · A4 미리보기·워드·PDF로 내려받을 수 있어요.' : ' · 작성한 뒤 [보고서 제출]을 눌러 주세요.') + '</p>';
  if(readonly) h += '<div class="card tight"><div class="small" style="color:var(--amber)">👀 교수 열람 모드 — 이 보고서는 ' + esc(R.name || R.sid) + ' 학생의 제출본입니다. 내용은 수정할 수 없고 내려받기만 됩니다.</div></div>';

  /* 머리말 */
  h += '<div class="card"><h3>머리말</h3><div class="rf-meta">';
  h += '<div class="fld"><label>과목</label><input type="text" value="' + esc((m.course&&m.course.value)||"유전자분석") + '" readonly></div>';
  h += '<div class="fld"><label>주차</label><input type="text" value="' + esc((m.week&&m.week.value)||lab.weekLabel||"") + '" readonly></div>';
  h += '<div class="fld" style="grid-column:1 / -1"><label>실험명</label><input type="text" value="' + esc((m.expName&&m.expName.value)||def.experimentName||"") + '" readonly></div>';
  h += '<div class="fld"><label>실험일자</label><input id="rfDate" type="text" value="' + esc((m.date&&m.date.value)||"") + '"' + (readonly?" readonly":"") + '></div>';
  h += '<div class="fld"><label>조</label><input id="rfTeam" type="text" placeholder="예: 3조" value="' + esc((m.team&&m.team.value)||"") + '"' + (readonly?" readonly":"") + '></div>';
  h += '<div class="fld"><label>학번</label><input type="text" value="' + esc((m.sid&&m.sid.value)||"") + '" readonly></div>';
  h += '<div class="fld"><label>이름</label><input type="text" value="' + esc((m.name&&m.name.value)||"") + '" readonly></div>';
  h += '</div></div>';

  /* 섹션 */
  (def.sections || []).forEach(function(s){
    var lbl = (s.no ? s.no + '. ' : '') + s.label;
    h += '<div class="card"><div class="rf-sec">';
    h += '<div class="rf-lbl">' + esc(lbl) + '</div>';
    if(s.hint) h += '<div class="rf-hint">' + esc(s.hint) + '</div>';
    if(s.type === "images"){
      h += buildImageSlots(s, data, readonly);
      h += '</div></div>';
      return;
    }
    var v = (data.sections && data.sections[s.key]) || "";
    h += '<textarea data-sec="' + esc(s.key) + '" rows="' + (s.rows || 4) + '"' + (readonly?" readonly":"") + ' placeholder="여기에 작성하세요">' + esc(v) + '</textarea>';
    if(s.table){
      var T = s.table, cols = T.cols || [], rows = T.rowLabels || [];
      h += '<table class="rf-tbl"><tr>';
      cols.forEach(function(c){ h += '<th>' + esc(c) + '</th>'; });
      h += '</tr>';
      rows.forEach(function(rl, ri){
        h += '<tr><td class="rowlbl">' + esc(rl) + '</td>';
        var rowvals = (data.tables && data.tables[s.key] && data.tables[s.key][ri]) || [];
        for(var ci = 1; ci < cols.length; ci++){
          var cv = rowvals[ci - 1] || "";
          h += '<td><input type="text" data-tbl="' + esc(s.key) + '" data-r="' + ri + '" data-c="' + (ci - 1) + '" value="' + esc(cv) + '"' + (readonly?" readonly":"") + '></td>';
        }
        h += '</tr>';
      });
      h += '</table>';
    }
    h += '</div></div>';
  });

  /* 액션 */
  if(!readonly){
    h += '<div class="row"><button class="btn sm" type="button" id="rfSave">💾 임시 저장</button>';
    h += '<button class="btn ' + (data.submitted ? '' : 'primary') + '" type="button" id="rfSubmit">' + (data.submitted ? '✅ 제출됨 — 다시 제출' : '보고서 제출') + '</button></div>';
  }else{
    h += '<div class="row"><button class="btn sm" type="button" id="rfPreview">A4 미리보기 👁</button>';
    h += '<button class="btn sm" type="button" id="rfWord">📄 워드(.doc)</button></div>';
    h += '<button class="btn sm" type="button" id="rfPdf">🖨 PDF로 저장</button>';
  }
  h += '<p class="small" style="margin-top:10px">※ 로컬 시제품 — 작성 내용은 이 기기 안에만 저장됩니다.' + (readonly ? ' PDF는 인쇄 대화상자에서 "PDF로 저장"을 고르세요.' : ' 제출하면 교수 확인 화면에 기록됩니다.') + '</p>';

  sc.innerHTML = h;

  function collect(){
    if(readonly) return data;
    var d = R.data;
    if(!d.meta) d.meta = {};
    if($("rfDate")) d.meta.date = ($("rfDate").value || "").trim();
    if($("rfTeam")) d.meta.team = ($("rfTeam").value || "").trim();
    if(!d.sections) d.sections = {};
    sc.querySelectorAll("[data-sec]").forEach(function(t){ d.sections[t.getAttribute("data-sec")] = t.value; });
    if(!d.tables) d.tables = {};
    sc.querySelectorAll("[data-tbl]").forEach(function(inp){
      var k = inp.getAttribute("data-tbl"), r = parseInt(inp.getAttribute("data-r"),10), c = parseInt(inp.getAttribute("data-c"),10);
      if(!d.tables[k]) d.tables[k] = [];
      if(!d.tables[k][r]) d.tables[k][r] = [];
      d.tables[k][r][c] = inp.value;
    });
    return d;
  }
  function persist(silent){
    var d = collect();
    d.savedAt = today();
    var ok = saveReport(R.sid, d);
    if(!silent) toast(ok ? "임시 저장했습니다." : "저장이 막혀 있습니다(브라우저 설정).");
    return d;
  }
  if($("rpBack")) $("rpBack").onclick = function(){ if(!readonly) persist(true); go(state.role==="prof"?"profdash":"lobby"); };
  if($("rfSave")) $("rfSave").onclick = function(){ persist(false); };
  if($("rfPreview")) $("rfPreview").onclick = function(){ R.data = readonly ? data : persist(true); R.view = "preview"; RENDER.report(); };
  if($("rfWord")) $("rfWord").onclick = function(){ var d = readonly ? data : persist(true); downloadReportWord(R.sid, R.name, d); };
  if($("rfPdf")) $("rfPdf").onclick = function(){ var d = readonly ? data : persist(true); printReportPDF(R.sid, R.name, d); };
  if($("rfSubmit")) $("rfSubmit").onclick = function(){
    var d = collect(); d.submitted = true; d.submittedAt = today(); d.savedAt = today();
    saveReport(R.sid, d); R.data = d;
    toast("보고서를 제출했습니다. (교수 확인 화면에 기록됩니다)");
    if(!reduced) showReward({ face:"celebrate", kicker:"결과보고서 제출", title:"제출 완료", sub:curLab().weekLabel + " " + curLab().title + " 결과보고서", hold:2600 });
    RENDER.report();
  };
  /* 편집 중 자동 저장(입력 멈춤 시) */
  if(!readonly){
    var saveTimer = null;
    sc.querySelectorAll("textarea,[data-tbl],#rfDate,#rfTeam").forEach(function(el){
      el.oninput = function(){ if(saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(function(){ persist(true); }, 700); };
    });
    /* 이미지 업로드 슬롯 바인딩 */
    sc.querySelectorAll("[data-imgpick]").forEach(function(b){
      b.onclick = function(){ var f = document.getElementById(b.getAttribute("data-imgpick")); if(f) f.click(); };
    });
    sc.querySelectorAll("[data-imgfile]").forEach(function(inp){
      inp.onchange = function(){
        var file = inp.files && inp.files[0];
        if(!file) return;
        var key = inp.getAttribute("data-imgfile"), idx = parseInt(inp.getAttribute("data-idx"), 10);
        toast("사진 처리 중…");
        resizeImageFile(file, 1000, function(durl, err){
          if(err || !durl){ toast(err || "사진을 불러오지 못했습니다."); return; }
          collect();                               /* 고찰 등 현재 입력 보존 */
          var d = R.data;
          if(!d.images) d.images = {};
          if(!Array.isArray(d.images[key])) d.images[key] = [];
          var prev = d.images[key][idx] || "";
          d.images[key][idx] = durl;
          d.savedAt = today();
          var ok = saveReport(R.sid, d);

 *   실제 저장키(progKeyFor·reportKey·TEAMS_KEY·EARLY_KEY)에 그대로 주입하므로
 *   교수 대시보드가 실제 학생 활동과 똑같이 표·집계를 그린다. 덮어쓰기 전 원래
 *   값을 스냅샷(DEMO_SNAPSHOT_KEY)에 담아 두어, [지우기]로 정확히 원상복구한다.
 * ========================================================================*/

/* 배양 접시 예시 이미지 — canvas 로 즉석 생성(외부 통신 없음). colonies = 콜로니 점 개수 */
function demoPlate(seed, colonies, label){
  try{
    var cv = document.createElement("canvas"); cv.width = 220; cv.height = 160;
    var g = cv.getContext("2d");
    g.fillStyle = "#f6f1e6"; g.fillRect(0, 0, 220, 160);
    g.beginPath(); g.arc(110, 78, 66, 0, Math.PI * 2); g.fillStyle = "#ece0c2"; g.fill();
    g.lineWidth = 5; g.strokeStyle = "#c3aa72"; g.stroke();
    var r = ((seed * 9301 + 49297) % 233280 + 233280) % 233280;
    function rnd(){ r = (r * 9301 + 49297) % 233280; return r / 233280; }
    for(var i = 0; i < colonies; i++){
      var a = rnd() * Math.PI * 2, rad = rnd() * 54;
      var x = 110 + Math.cos(a) * rad, y = 78 + Math.sin(a) * rad;
      g.beginPath(); g.arc(x, y, 1.5 + rnd() * 2.4, 0, Math.PI * 2);
      g.fillStyle = "#cdbb7d"; g.fill();
    }
    g.fillStyle = "#5a4a1e"; g.font = "11px sans-serif";
    g.fillText(String(label || ""), 8, 152);
    return cv.toDataURL("image/jpeg", 0.7);
  }catch(e){ return ""; }
}

function clearDemo(){
  var snap = null;
  try{ snap = JSON.parse(localStorage.getItem(DEMO_SNAPSHOT_KEY) || "null"); }catch(e){ snap = null; }
  if(snap && typeof snap === "object"){
    for(var k in snap){ if(snap.hasOwnProperty(k)){
      try{
        if(snap[k] === null || snap[k] === undefined) localStorage.removeItem(k);
        else localStorage.setItem(k, snap[k]);
      }catch(e){}
    } }
  }
  try{ localStorage.removeItem(DEMO_SNAPSHOT_KEY); }catch(e){}
  return true;
}
